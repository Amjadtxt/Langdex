<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-content="CONTENT-TYPE" content="text/html; charset=UTF-8">
  <title>Users Management</title>

  <!-- CSS -->
  <link rel="stylesheet" href="/Langdex/style.css">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- SheetJS للإكسيل إن لزم -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <!-- مكتبة jsPDF لتصدير الـ PDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <style>
    /* الإعدادات الأساسية للكونتينر العام */
    .content {
      padding: 0 15px !important;
      box-sizing: border-box !important;
    }

    .content > div {
      width: 100% !important;
      max-width: 850px !important;
      margin: 15px auto !important;
      box-sizing: border-box !important;
    }

    /* تثبيت اللون #678071 لكل الأقسام في صفحة المستخدمين */
    .search-section,
    .form,
    .data-section {
      background: #678071 !important;
      padding: 20px !important;
      border-radius: 10px !important;
      border: 1px solid rgba(255, 255, 255, 0.2) !important;
      margin-bottom: 15px !important;
      box-sizing: border-box !important;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
    }

    /* العناوين الداخلية */
    .search-section h1,
    .form h1,
    .data-section h1 {
      text-align: center;
      color: #ffffff;
      margin-bottom: 15px;
      font-size: 20px;
    }

    /* --- تقييد وتوسيط حقول الإدخال والبحث لتكون ملمومة واحترافية --- */
    .search-section input.search-txt,
    .form input,
    .form select {
      display: block !important;
      width: 100% !important;
      max-width: 450px !important;
      margin: 10px auto !important;
      box-sizing: border-box !important;
      font-family: 'Cairo', sans-serif !important;
      border-radius: 8px !important;
      padding: 12px !important;
      font-size: 14px !important;
    }

    .search-section input.search-txt {
      background: #ffffff !important;
      border: 1px solid #ccc !important;
      color: #000000 !important;
    }

    .form select {
      background: #2a2a2a !important;
      border: 1px solid #444 !important;
      color: white !important;
    }

    .form input {
      background: #ffffff !important;
      border: 1px solid #ccc !important;
      color: #000000 !important;
    }

    /* تنسيق زر الإضافة ليكون ملموماً ومتوسطاً */
    .inter1 {
      display: flex !important;
      gap: 10px !important;
      width: 100% !important;
      max-width: 450px !important;
      margin: 15px auto 0 auto !important;
      box-sizing: border-box !important;
    }
    .inter1 button {
      flex: 1 !important;
      padding: 12px 10px !important;
      border: none !important;
      border-radius: 8px !important;
      font-weight: bold !important;
      cursor: pointer !important;
      font-family: 'Cairo', sans-serif !important;
      transition: 0.2s !important;
      box-sizing: border-box !important;
      color: white !important;
      text-align: center !important;
      font-size: 14px !important;
    }
    .inter1 .reg { background: #27ae60; }
    .inter1 .reg:hover { background: #219653; }

    /* جدول عرض المستخدمين (يأخذ راحته بالعرض المريح) */
    .table-container {
      width: 100% !important;
      margin: 0 auto !important;
      overflow-x: auto;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      background: rgba(0, 0, 0, 0.15);
      border-radius: 8px;
      overflow: hidden;
    }
    th, td {
      padding: 10px 8px;
      text-align: center;
      font-size: 13px;
      color: #fff;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    th {
      background: rgba(0, 0, 0, 0.25);
      font-weight: bold;
    }

    /* تعديلات الموبايل لمنع أي لخبطة وتجاوب كامل */
    @media (max-width: 768px) {
      .content {
        padding: 0 10px !important;
      }
      .content > div {
        width: 100% !important;
        margin: 10px auto !important;
        padding: 15px !important;
      }

      .inter1 {
        max-width: 100% !important;
      }

      .search-section input.search-txt,
      .form input,
      .form select {
        max-width: 100% !important;
      }

      /* تحويل الجدول في الموبايل لشكل بطاقات مرتبة ومتوسطة */
      .table-container table, 
      .table-container thead, 
      .table-container tbody, 
      .table-container th, 
      .table-container td, 
      .table-container tr {
        display: block !important;
        width: 100% !important;
        box-sizing: border-box !important;
      }

      .table-container thead {
        display: none !important;
      }

      .table-container tr {
        background: rgba(255, 255, 255, 0.05);
        margin-bottom: 12px;
        border-radius: 8px;
        padding: 12px;
        border: 1px solid rgba(255, 255, 255, 0.15);
        box-sizing: border-box;
      }

      .table-container td {
        display: flex !important;
        justify-content: space-between !important;
        align-items: center !important;
        text-align: right !important; /* ضبط المحاذاة لليمين لتتطابق مع اللغة العربية */
        direction: rtl !important;
        padding: 8px 4px !important;
        font-size: 13px !important;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      }

      .table-container td:last-child {
        border-bottom: none !important;
        flex-direction: column !important;
        gap: 8px !important;
        padding-top: 12px !important;
      }

      .table-container td button,
      .table-container td select {
        width: 100% !important;
        font-size: 12px !important;
        padding: 8px !important;
        box-sizing: border-box !important;
      }
    }
  </style>
</head>

<body>

  <!-- ==================================================
       HEADER
  ================================================== -->
  <header>
    <div class="user-bar">
      <span id="username">مرحباً، User</span>
      <button id="logout-btn">تسجيل الخروج</button>
    </div>

    <nav class="bar">
      <ul>
        <a href="/Langdex/admin.html"><li>الرئيسية</li></a>
        <a href="/Langdex/admin-manage.html"><li>إدارة</li></a>
        <a href="/Langdex/users.html"><li>المستخدمين</li></a>
        <a href="#"><li>الإعدادات</li></a>
      </ul>
    </nav>
  </header>


  <!-- ==================================================
       DASHBOARD CONTENT
  ================================================== -->
  <div class="content">

    <!-- قسم البحث عن المستخدمين -->
    <div class="search-section">
      <h1>بحث</h1>
      <input type="text" class="search-txt" id="search-user-input" placeholder="اكتب البريد الإلكتروني للبحث...">
    </div>

    <!-- قسم إضافة مستخدم جديد -->
    <div class="form">
      <h1>إضافة مستخدم</h1>
      <input type="email" id="new-user-email" placeholder="البريد الإلكتروني">
      <input type="password" id="new-user-password" placeholder="كلمة المرور (الباسورد)">
      <select id="new-user-role">
        <option value="" disabled selected>اختر الرول (الصلاحية)</option>
        <option value="user">مستخدم عادي (user)</option>
        <option value="admin">مشرف (admin)</option>
      </select>
      <div class="inter1">
        <button type="button" class="reg" id="add-user-btn">حفظ وإضافة</button>
      </div>
    </div>

    <!-- جدول عرض المستخدمين -->
    <div class="data-section">
      <h1>قائمة المستخدمين</h1>
      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>#</th>
              <th>البريد الإلكتروني</th>
              <th>الرول</th>
              <th>عدد الكلمات</th>
              <th>إحصائيات اللغات</th>
              <th>الإجراءات والتحكم</th>
            </tr>
          </thead>
          <tbody id="users-table-body">
            <tr><td colspan="6" style="text-align: center;">جاري تحميل بيانات المستخدمين...</td></tr>
          </tbody>
        </table>
      </div>
    </div>

  </div>


  <!-- ==================================================
       JAVASCRIPT
  ================================================== -->
  <script type="module" src="/Langdex/auth-guard.js"></script>
  <script type="module" src="/Langdex/user-bar.js"></script>
  <script type="module" src="/Langdex/admin-users.js"></script>

</body>

</html>
