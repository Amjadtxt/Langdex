<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>سجل العمليات والتراجع - Langdex</title>

  <!-- CSS -->
  <link rel="stylesheet" href="/Langdex/style.css">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    /* الإعدادات العامة للكونتينر */
    .content {
      padding: 0 15px !important;
      box-sizing: border-box !important;
    }

    .content > div,
    .actions-top-bar,
    .data-section {
      width: 100% !important;
      max-width: 950px !important;
      margin: 15px auto !important;
      box-sizing: border-box !important;
    }

    /* الأقسام الرئيسية بنفس خلفية الداشبورد */
    .actions-top-bar,
    .data-section {
      background: #678071 !important;
      padding: 20px !important;
      border-radius: 10px !important;
      border: 1px solid rgba(255, 255, 255, 0.2) !important;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
    }

    .data-section h1 {
      text-align: center;
      color: #ffffff;
      margin-bottom: 15px;
      font-size: 20px;
    }

    /* شريط الأزرار العلوية */
    .actions-top-bar {
      display: flex !important;
      justify-content: space-between !important;
      align-items: center !important;
      flex-wrap: wrap !important;
      gap: 12px !important;
    }

    .actions-top-bar span {
      color: #ffffff;
      font-size: 15px;
      font-weight: 500;
    }

    .btn-undo-last {
      background: #c0392b !important;
      color: white !important;
      padding: 10px 20px !important;
      border: none !important;
      border-radius: 8px !important;
      font-weight: bold !important;
      cursor: pointer !important;
      font-family: 'Cairo', sans-serif !important;
      font-size: 14px !important;
      transition: 0.2s !important;
      display: inline-flex !important;
      align-items: center !important;
      gap: 8px !important;
    }

    .btn-undo-last:hover {
      background: #962d22 !important;
    }

    /* شارات نوع الحدث */
    .badge {
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: bold;
      display: inline-block;
    }
    .badge-add { background-color: #27ae60; color: #fff; }
    .badge-edit { background-color: #2980b9; color: #fff; }
    .badge-delete { background-color: #e74c3c; color: #fff; }
    .badge-bulk { background-color: #8e44ad; color: #fff; }

    /* جدول السجلات */
    .table-container {
      width: 100% !important;
      margin: 0 auto !important;
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: rgba(0, 0, 0, 0.15);
      border-radius: 8px;
      overflow: hidden;
    }

    th, td {
      padding: 12px 10px;
      text-align: center;
      font-size: 13px;
      color: #fff;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    th {
      background: rgba(0, 0, 0, 0.25);
      font-weight: bold;
    }

    .btn-table-undo {
      background-color: #e67e22;
      color: white;
      border: none;
      padding: 6px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-family: 'Cairo', sans-serif;
      font-size: 12px;
      font-weight: bold;
      transition: 0.2s;
    }

    .btn-table-undo:hover {
      background-color: #d35400;
    }

    /* الموبايل */
    @media (max-width: 768px) {
      .actions-top-bar {
        flex-direction: column !important;
        text-align: center !important;
      }
      .btn-undo-last {
        width: 100% !important;
        justify-content: center !important;
      }
      .table-container table, .table-container thead, .table-container tbody, 
      .table-container th, .table-container td, .table-container tr {
        display: block !important;
        width: 100% !important;
      }
      .table-container thead { display: none !important; }
      .table-container tr {
        background: rgba(255, 255, 255, 0.05);
        margin-bottom: 12px;
        border-radius: 8px;
        padding: 10px;
        border: 1px solid rgba(255, 255, 255, 0.15);
      }
      .table-container td {
        display: flex !important;
        justify-content: space-between !important;
        align-items: center !important;
        padding: 8px 4px !important;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      }
      .table-container td:last-child {
        border-bottom: none !important;
        padding-top: 10px !important;
      }
      .btn-table-undo {
        width: 100% !important;
        padding: 8px !important;
      }
    }
  </style>
</head>

<body>

  <!-- ==================================================
       HEADER
  ================================================== -->
  <header>
    <div class="user-bar">
      <span id="username">مرحباً، User</span>
      <button id="logout-btn">تسجيل الخروج</button>
    </div>

    <nav class="bar">
      <ul>
        <a href="/Langdex/admin.html"><li>الرئيسية</li></a>
        <a href="/Langdex/log.html"><li>السجل</li></a>
        <a href="/Langdex/users.html"><li>المستخدمين</li></a>
        <a href="#"><li>الإعدادات</li></a>
      </ul>
    </nav>
  </header>

  <!-- ==================================================
       LOGS CONTENT
  ================================================== -->
  <div class="content">

    <!-- شريط التحكم السريع -->
    <div class="actions-top-bar">
      <span>متابعة وتتبع كافة التغييرات والعمليات على النظام:</span>
      <button type="button" class="btn-undo-last" id="undoLastBtn">
        ↺ التراجع عن آخر عملية
      </button>
    </div>

    <!-- جدول السجلات والتراجع -->
    <div class="data-section">
      <h1>سجل العمليات والتراجع</h1>
      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th style="width: 50px;">م</th>
              <th style="width: 110px;">نوع الحدث</th>
              <th>التفاصيل</th>
              <th style="width: 150px;">المنفذ</th>
              <th style="width: 160px;">التاريخ والوقت</th>
              <th style="width: 110px;">الإجراء</th>
            </tr>
          </thead>
          <tbody id="logsTableBody">
            <tr><td colspan="6" style="text-align: center;">جاري تحميل سجل العمليات...</td></tr>
          </tbody>
        </table>
      </div>
    </div>

  </div>

  <!-- JAVASCRIPT -->
  <script type="module" src="/Langdex/auth-guard.js"></script>
  <script type="module" src="/Langdex/user-bar.js"></script>
  <script type="module" src="admin-logs.js"></script>

</body>
</html>
