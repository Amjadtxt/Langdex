<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="CONTENT-TYPE" content="text/html; charset=UTF-8">
    <link rel="stylesheet" href="/Langdex/style.css"/>
    <title>Langdex - المترجم الذكي المتقدم</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        html { visibility: hidden; }
        .translator-box { background: #fff; padding: 25px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-top: 20px; }
        .translator-box textarea, .translator-box select { width: 100%; padding: 10px; margin-top: 8px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 5px; font-family: 'Cairo', sans-serif; }
        .translator-box button { background-color: #2563eb; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; font-family: 'Cairo', sans-serif; font-weight: 600; width: 100%; }
        .translator-box button:hover { background-color: #1d4ed8; }
        .result-box { margin-top: 20px; padding: 15px; background: #f3f4f6; border-radius: 5px; border: 1px solid #e5e7eb; font-size: 1.1rem; white-space: pre-wrap; }
    </style>
</head>
<body>
  <header>
    <div class="user-bar">
        <span id="username">مرحباً، User</span>
        <button id="logout-btn">تسجيل الخروج</button>
    </div>
    <nav class="bar">
      <ul>
        <a href="/Langdex/index.html"><li>الرئيسية</li></a> 
        <a href="/Langdex/data.html"><li>البيانات</li></a> 
        <a href="/Langdex/translator.html"><li style="color: #2563eb; font-weight: bold;">المترجم الذكي</li></a>
        <a href="#"><li>حول</li></a>
        <a href="#"><li>التواصل</li></a>
      </ul>
    </nav> 
  </header>

  <div class="content">
      <div class="translator-box">
          <h1>المترجم الذكي ومولد الجمل</h1>
          <p style="color: #666; margin-bottom: 15px;">اختر اتجاه الترجمة والتحويل، واكتب الجملة ليقوم النظام بسحب القاموس من قاعدة البيانات وضبط التصريفات بدقة.</p>
          
          <label>اختر اتجاه الترجمة والتحويل:</label>
          <select id="translationDirection">
              <option value="ar-to-hi">من العربية إلى الهندية (Arabic to Hindi)</option>
              <option value="hi-to-ar">من الهندية إلى العربية (Hindi to Arabic)</option>
              <option value="ar-to-ur">من العربية إلى الأوردو (Arabic to Urdu)</option>
              <option value="ur-to-ar">من الأوردو إلى العربية (Urdu to Arabic)</option>
              <option value="hi-to-ur">من الهندية إلى الأوردو (Hindi to Urdu)</option>
              <option value="ur-to-hi">من الأوردو إلى الهندية (Urdu to Hindi)</option>
          </select>

          <label>اكتب الجملة المراد ترجمتها:</label>
          <textarea id="userRequest" rows="3" placeholder="اكتب الجملة هنا باللغة المصدر..."></textarea>

          <button type="button" id="generateBtn">ترجمة وتصريف الجملة</button>

          <div id="resultContainer" style="display: none;">
              <h3>النتيجة:</h3>
              <div id="resultOutput" class="result-box"></div>
          </div>
      </div>
  </div>

  <!-- سكربتات المشروع الأصلية -->
  <script type="module" src="/Langdex/auth-guard.js"></script>
  <script type="module" src="/Langdex/user-bar.js"></script>
  <script type="module" src="/Langdex/script.js"></script>

  <!-- ملف المنطق البرمجي المنفصل -->
  <script type="module" src="/Langdex/translator.js"></script>
</body>
</html>
