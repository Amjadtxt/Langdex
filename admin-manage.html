<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-content="CONTENT-TYPE" content="text/html; charset=UTF-8">
  <title>Admin Management</title>

  <!-- CSS -->
  <link rel="stylesheet" href="/Langdex/style.css">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- SheetJS للإكسيل -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <style>
    .content {
      padding: 0 15px !important;
      box-sizing: border-box !important;
    }

    .excel-upload-section,
    .actions-top-bar,
    .range-delete-box,
    .data-section {
      width: 100% !important;
      max-width: 850px !important;
      margin: 15px auto !important;
      box-sizing: border-box !important;
      background: #678071 !important;
      padding: 20px !important;
      border-radius: 10px !important;
      border: 1px solid rgba(255, 255, 255, 0.2) !important;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
    }

    .range-delete-box h1,
    .data-section h1 {
      text-align: center;
      color: #ffffff;
      margin-bottom: 15px;
      font-size: 20px;
    }

    /* 1. قسم رفع الإكسيل */
    .excel-upload-section {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
    }

    .excel-upload-section h3 {
      color: #ffffff;
      font-size: 15px;
      margin: 0;
    }

    .excel-upload-label {
      background: #27ae60;
      color: white;
      padding: 10px 20px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      font-family: 'Cairo', sans-serif;
      transition: 0.2s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
    }

    .excel-upload-label:hover { background: #219653; }

    /* 2. أزرار المكرر والتصنيف */
    .actions-top-bar {
      display: flex !important;
      gap: 10px !important;
      align-items: center !important;
    }

    .actions-top-bar button {
      flex: 1 !important;
      padding: 12px 10px !important;
      border: none !important;
      border-radius: 8px !important;
      font-weight: bold !important;
      cursor: pointer !important;
      font-family: 'Cairo', sans-serif !important;
      color: white !important;
      text-align: center !important;
      font-size: 14px !important;
      transition: 0.2s !important;
    }

    .fix-lang-btn { background: #8e44ad; }
    .fix-lang-btn:hover { background: #732d91; }

    .delete-edited-btn { background: #c0392b; }
    .delete-edited-btn:hover { background: #962d22; }

    /* 3. حذف بنطاق الـ ID */
    .range-delete-inputs {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: center;
    }

    .range-delete-inputs input {
      flex: 1;
      min-width: 140px;
      max-width: 250px !important;
      margin: 0 !important;
      display: block !important;
      box-sizing: border-box !important;
      font-family: 'Cairo', sans-serif !important;
      border-radius: 8px !important;
      padding: 12px !important;
      font-size: 14px !important;
      background: #ffffff !important;
      border: 1px solid #ccc !important;
      color: #000000 !important;
    }

    .range-delete-btn {
      width: 100% !important;
      max-width: 450px !important;
      background: #852222;
      color: white;
      padding: 12px 10px;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      font-family: 'Cairo', sans-serif;
      transition: 0.2s;
      text-align: center;
      font-size: 14px;
      margin: 15px auto 0 auto !important;
      display: block !important;
    }

    .range-delete-btn:hover { background: #a93232; }

    /* جدول البيانات للتوضيح */
    .table-container {
      width: 100% !important;
      margin: 0 auto !important;
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: rgba(0, 0, 0, 0.15);
      border-radius: 8px;
      overflow: hidden;
    }

    th, td {
      padding: 10px 8px;
      text-align: center;
      font-size: 13px;
      color: #fff;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    th {
      background: rgba(0, 0, 0, 0.25);
      font-weight: bold;
    }

    @media (max-width: 768px) {
      .content { padding: 0 10px !important; }
      .excel-upload-section,
      .actions-top-bar,
      .range-delete-box,
      .data-section {
        width: 100% !important;
        margin: 10px auto !important;
        padding: 15px !important;
      }

      .excel-upload-section {
        flex-direction: column !important;
        text-align: center !important;
      }

      .excel-upload-section label {
        width: 100% !important;
        box-sizing: border-box !important;
      }

      .actions-top-bar,
      .range-delete-inputs {
        flex-direction: column !important;
        gap: 8px !important;
        max-width: 100% !important;
      }

      .actions-top-bar button, 
      .range-delete-inputs input,
      .range-delete-btn {
        width: 100% !important;
        max-width: none !important;
        margin: 0 !important;
      }

      .table-container table, 
      .table-container thead, 
      .table-container tbody, 
      .table-container th, 
      .table-container td, 
      .table-container tr {
        display: block !important;
        width: 100% !important;
      }

      .table-container thead { display: none !important; }

      .table-container tr {
        background: rgba(255, 255, 255, 0.05);
        margin-bottom: 12px;
        border-radius: 8px;
        padding: 10px;
        border: 1px solid rgba(255, 255, 255, 0.15);
      }

      .table-container td {
        display: flex !important;
        justify-content: space-between !important;
        align-items: center !important;
        text-align: left !important;
        padding: 6px 4px !important;
        font-size: 13px !important;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="user-bar">
      <span id="username">مرحباً، User</span>
      <button id="logout-btn">تسجيل الخروج</button>
    </div>

    <nav class="bar">
      <ul>
        <a href="/Langdex/admin.html"><li>الرئيسية</li></a>
        <a href="/Langdex/admin-manage.html"><li>إدارة</li></a>
        <a href="/Langdex/admin-logs.html"><li>السجلات</li></a>
        <a href="/Langdex/users.html"><li>المستخدمين</li></a>
        <a href="#"><li>الإعدادات</li></a>
      </ul>
    </nav>
  </header>

  <div class="content">

    <!-- 1. قسم رفع ملف الإكسيل -->
    <div class="excel-upload-section">
      <h3>رفع الكلمات بإستخدام ملف إكسيل</h3>
      <label for="excelFileInput" class="excel-upload-label">
        <span>رفع الملف</span>
        <input type="file" id="excelFileInput" accept=".xlsx, .xls, .csv" style="display: none;">
      </label>
    </div>

    <!-- 2. أزرار تغيير التصنيف وحذف المكرر -->
    <div class="actions-top-bar">
      <button type="button" class="fix-lang-btn" id="renameAnyLangBtn">تغيير اسم التصنيف</button>
      <button type="button" class="delete-edited-btn" id="deleteDuplicatesBtn">حذف الكلمات المكررة</button>
    </div>

    <!-- 3. قسم حذف بنطاق الـ ID -->
    <div class="range-delete-box">
      <h1>حذف الكلمات بنطاق الـ ID</h1>
      <div class="range-delete-inputs">
        <input type="number" id="startIdInput" placeholder="من ID رقم...">
        <input type="number" id="endIdInput" placeholder="إلى ID رقم...">
      </div>
      <button type="button" class="range-delete-btn" id="deleteRangeBtn">حذف النطاق المحدد</button>
  <script type="module" src="/Langdex/auth-guard.js"></script>
  <script type="module" src="/Langdex/user-bar.js"></script>
  <script type="module" src="admin.js"></script>

</body>

</html>
