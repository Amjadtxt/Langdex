<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>User Settings</title>
<link rel="stylesheet" href="/Langdex/style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
.content{padding:0 15px !important;box-sizing:border-box !important;}
.content>div{width:100% !important;max-width:600px !important;margin:15px auto !important;box-sizing:border-box !important;}
.settings-section{background:#678071 !important;padding:15px !important;border-radius:10px !important;border:1px solid rgba(255,255,255,.2) !important;box-shadow:0 4px 15px rgba(0,0,0,.2);margin-bottom:15px !important;}
.settings-section h1{text-align:center;color:#fff;margin-bottom:12px;font-size:18px;}
.settings-section h2{color:#fff;font-size:15px;margin:0 0 10px;border-bottom:1px solid rgba(255,255,255,.25);padding-bottom:6px;}
.field-row{display:flex;align-items:center;justify-content:space-between;margin:8px 0;color:#fff;font-family:'Cairo',sans-serif;font-size:13px;}
.field-row label{flex:1;}
.settings-section input[type="text"],
.settings-section input[type="email"],
.settings-section input[type="password"],
.settings-section select{
  width:100% !important; box-sizing:border-box !important; font-family:'Cairo',sans-serif !important;
  border-radius:6px !important; padding:8px 12px !important; font-size:13px !important; background:#fff !important;
  border:1px solid #ccc !important; color:#000 !important; margin:6px 0 !important;
  text-align: center !important; height: 38px !important; /* تقليل ارتفاع وصناديق الإدخال لتكون أصغر وأرتب */
}
.switch{position:relative;display:inline-block;width:42px;height:22px;flex-shrink:0;direction: ltr !important;}
.switch input{opacity:0;width:0;height:0;}
.slider{position:absolute;cursor:pointer;inset:0;background:#a9b6ae;border-radius:22px;transition:.2s;}
.slider:before{position:absolute;content:"";height:16px;width:16px;left:3px;bottom:3px;background:#fff;border-radius:50%;transition:.2s;}
.switch input:checked + .slider{background:#00bcd4;}
.switch input:checked + .slider:before{transform:translateX(20px);}
.save-btn{display:block;width:100%;color:#fff;padding:9px;border:none;border-radius:6px;font-weight:bold;
  cursor:pointer;margin:8px auto 0;font-family:'Cairo',sans-serif;font-size:13px;transition:.2s;text-align:center;background:#00bcd4;}
.save-btn:hover{background:#008ba3;}
.danger-btn{background:#e74c3c !important;}
.danger-btn:hover{background:#c0392b !important;}
.settings-msg{text-align:center;margin-top:8px;color:#fff;font-size:12px;min-height:16px;}
@media (max-width:768px){.content{padding:0 8px !important;}.content>div{margin:10px auto !important;padding:0 !important;}}
</style>
</head>
<body>
<header>
  <div class="user-bar">
    <span id="username">مرحباً، User</span>
    <button id="logout-btn">تسجيل الخروج</button>
  </div>
  <nav class="bar">
    <ul>
      <a href="/Langdex/index.html"><li>الرئيسية</li></a> 
        <a href="/Langdex/data.html"><li>الإدارة</li></a> 
        <a href="/Langdex/settings.html"><li>الإعدادات</li></a>
        <a href="#"><li>استكشاف</li></a>
        <a href="#"><li>التواصل</li></a>
    </ul>
  </nav>
</header>

<div class="content">
  <div class="settings-section">
    <h1>الإعدادات</h1>

    <h2>الحساب</h2>
    <input type="text" id="display-name" placeholder="اسم المستخدم">
    <input type="email" id="account-email" placeholder="البريد الإلكتروني" disabled>
    <button type="button" class="save-btn" id="save-profile-btn">حفظ بيانات الحساب</button>

    <h2 style="margin-top:15px;">كلمة المرور</h2>
    <input type="password" id="current-password" placeholder="كلمة المرور الحالية" autocomplete="current-password">
    <input type="password" id="new-password" placeholder="كلمة المرور الجديدة" autocomplete="new-password">
    <button type="button" class="save-btn" id="change-password-btn">تغيير كلمة المرور</button>

    <div id="account-msg" class="settings-msg"></div>
  </div>

  <div class="settings-section">
    <h2>تفضيلات العرض</h2>

    <div class="field-row">
      <label for="dark-mode-toggle">الوضع الداكن</label>
      <label class="switch">
        <input type="checkbox" id="dark-mode-toggle">
        <span class="slider"></span>
      </label>
    </div>

    <div class="field-row">
      <label for="results-per-page">عدد النتائج في الصفحة</label>
    </div>
    <select id="results-per-page">
      <option value="10">10</option>
      <option value="20" selected>20</option>
      <option value="50">50</option>
      <option value="100">الكل</option>
    </select>

    <div class="field-row">
      <label for="default-lang">اللغة الافتراضية للفلترة</label>
    </div>
    <select id="default-lang">
      <option value="all">جميع اللغات</option>
      <option value="الإنجليزية">الإنجليزية</option>
      <option value="الهندية">الهندية</option>
      <option value="الأردية">الأردية</option>
      <option value="الفارسية">الفارسية</option>
      <option value="الصينية">الصينية</option>
      <option value="البنغالية">البنغالية</option>
      <option value="التركية">التركية</option>
      <option value="الفرنسية">الفرنسية</option>
      <option value="الإسبانية">الإسبانية</option>
      <option value="الألمانية">الألمانية</option>
      <option value="اليابانية">اليابانية</option>
      <option value="الكورية">الكورية</option>
      <option value="الهولندية">الهولندية</option>
      <option value="العبرية">العبرية</option>
    </select>

    <div class="field-row">
      <label for="pdf-orientation">اتجاه ملف PDF عند التصدير</label>
    </div>
    <select id="pdf-orientation">
      <option value="portrait">طولي</option>
      <option value="landscape">عرضي</option>
    </select>

    <button type="button" class="save-btn" id="save-prefs-btn">حفظ التفضيلات</button>
    <div id="prefs-msg" class="settings-msg"></div>
  </div>

  <div class="settings-section">
    <h2>إشعارات</h2>
    <div class="field-row">
      <label for="notify-toggle">تفعيل إشعارات النظام</label>
      <label class="switch">
        <input type="checkbox" id="notify-toggle" checked>
        <span class="slider"></span>
      </label>
    </div>
  </div>

  <div class="settings-section">
    <h2>حذف الحساب</h2>
    <button type="button" class="save-btn danger-btn" id="delete-account-btn">حذف الحساب نهائياً</button>
  </div>
</div>
<script type="module" src="user-bar.js"></script>
<script type="module" src="/Langdex/settings.js"></script>
</body>
</html>
