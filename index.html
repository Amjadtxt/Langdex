<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="CONTENT-TYPE" content="text/html; charset=UTF-8">
  <link rel="stylesheet" href="/Langdex/style.css"/>
  <title>Langdex</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
      /* تنسيقات الألوان والستايل المظلم المستوحى من لوحة الأدمن */
      html {
          visibility: visible !important;
          background-color: #121212 !important;
          color: #ffffff !important;
          font-family: 'Cairo', sans-serif !important;
      }

      body {
          background-color: #121212 !important;
          color: #ffffff !important;
          margin: 0;
          padding: 0;
          font-family: 'Cairo', sans-serif !important;
      }

      header {
          background: #1e1e1e !important;
          border-bottom: 1px solid rgba(255, 255, 255, 0.1) !important;
          padding: 12px 20px !important;
      }

      .user-bar {
          display: flex;
          justify-content: space-between;
          align-items: center;
          margin-bottom: 10px;
      }

      #username {
          color: #00bcd4 !important;
          font-weight: 600;
      }

      #logout-btn {
          background: #c0392b !important;
          color: white !important;
          border: none !important;
          padding: 6px 14px !important;
          border-radius: 6px !important;
          cursor: pointer;
          font-family: 'Cairo', sans-serif !important;
          transition: 0.2s;
      }
      #logout-btn:hover { background: #962d22 !important; }

      .bar ul {
          list-style: none;
          padding: 0;
          margin: 0;
          display: flex;
          gap: 15px;
      }

      .bar ul a {
          color: #aaa !important;
          text-decoration: none;
          font-weight: 500;
          transition: 0.2s;
      }
      .bar ul a:hover, .bar ul a li:hover {
          color: #00bcd4 !important;
      }

      .content {
          width: 85% !important;
          max-width: 850px !important;
          margin: 25px auto !important;
          box-sizing: border-box !important;
      }

      .search-section {
          background: rgba(255, 255, 255, 0.03) !important;
          padding: 20px !important;
          border-radius: 10px !important;
          border: 1px solid rgba(255, 255, 255, 0.1) !important;
          margin-bottom: 20px !important;
          box-sizing: border-box !important;
      }

      .search-section h1 {
          font-size: 18px !important;
          color: #fff !important;
          margin-top: 0 !important;
          margin-bottom: 12px !important;
      }

      .search-txt {
          width: 100% !important;
          padding: 12px !important;
          background: #2a2a2a !important;
          border: 1px solid #444 !important;
          color: white !important;
          border-radius: 8px !important;
          box-sizing: border-box !important;
          font-family: 'Cairo', sans-serif !important;
          margin-bottom: 10px !important;
      }

      .search-btn {
          background: #00bcd4 !important;
          color: #121212 !important;
          border: none !important;
          padding: 10px 20px !important;
          border-radius: 8px !important;
          font-weight: bold !important;
          cursor: pointer;
          font-family: 'Cairo', sans-serif !important;
          transition: 0.2s;
          width: 100% !important;
      }
      .search-btn:hover { background: #008ba3 !important; color: white !important; }

      .search-result {
          margin-top: 10px !important;
          color: #aaa !important;
          font-size: 14px !important;
      }

      .form {
          background: rgba(255, 255, 255, 0.03) !important;
          padding: 20px !important;
          border-radius: 10px !important;
          border: 1px solid rgba(255, 255, 255, 0.1) !important;
          box-sizing: border-box !important;
      }

      .form h1 {
          font-size: 18px !important;
          color: #fff !important;
          margin-top: 0 !important;
          margin-bottom: 15px !important;
      }

      .form input, .form select {
          width: 100% !important;
          padding: 12px !important;
          margin-bottom: 12px !important;
          background: #2a2a2a !important;
          border: 1px solid #444 !important;
          color: white !important;
          border-radius: 8px !important;
          box-sizing: border-box !important;
          font-family: 'Cairo', sans-serif !important;
      }

      .form input:focus, .form select:focus {
          border-color: #00bcd4 !important;
          outline: none !important;
      }

      .inter1, .inter {
          display: flex !important;
          gap: 10px !important;
          flex-wrap: wrap !important;
          margin-top: 5px !important;
      }

      .form button {
          flex: 1 !important;
          padding: 11px !important;
          border: none !important;
          border-radius: 8px !important;
          font-weight: bold !important;
          cursor: pointer;
          font-family: 'Cairo', sans-serif !important;
          transition: 0.2s;
      }

      .reg { background: #27ae60 !important; color: white !important; }
      .reg:hover { background: #219653 !important; }

      .upa { background: #2980b9 !important; color: white !important; }
      .upa:hover { background: #2471a3 !important; }

      .del { background: #c0392b !important; color: white !important; }
      .del:hover { background: #962d22 !important; }

      .cel { background: #7f8c8d !important; color: white !important; }
      .cel:hover { background: #626d6e !important; }

      @media (max-width: 768px) {
          .content {
              width: 94% !important;
              margin: 10px auto !important;
          }
          .inter1, .inter {
              flex-direction: column !important;
          }
          .form button {
              width: 100% !important;
          }
      }
  </style>
</head>
<body>
  <header>
    <div class="user-bar">
        <span id="username">مرحباً، User</span>
        <button id="logout-btn">تسجيل الخروج</button>
    </div>
    <nav class="bar">
      <ul>
        <a href="#"><li>الرئيسية</li></a> 
        <a href="/Langdex/data.html"><li>البيانات</li></a> 
        <a href="#"><li>حول</li></a>
        <a href="#"><li>استكشاف</li></a>
        <a href="#"><li>التواصل</li></a>
      </ul>
    </nav> 
  </header>

  <div class="content">
    <div class="search-section">
      <h1>البحث</h1>
      <input type="text" placeholder="اكتب كلمة" class="search-txt">
      <button type="button" class="search-btn">
        بحث
      </button>
      <div class="search-result"></div>
    </div>

    <div class="form"> 
      <h1>تسجيل كلمة جديدة</h1>
      <input type="text" placeholder="ID" class="id" readonly="">
      <input type="text" placeholder="الكلمة">
      <input type="text" placeholder="المعنى">
      <input type="text" placeholder="المرادف">
      <select>
        <option value="" disabled selected>اختر اللغة</option>
        <option hidden>English</option>
        <option hidden>Hindi</option>
        <option hidden>Urdu</option>
        <option hidden>Persian</option>
        <option hidden>Chinese</option>
        <option hidden>Bengali</option>
        <option hidden>Turkish</option>
        <option hidden>French</option>
        <option hidden>Spanish</option>
        <option hidden>German</option>
        <option hidden>Japanese</option>
        <option hidden>Korean</option>
        <option hidden>Dutch</option>
        <option hidden>Hebrew</option>
        <option>الإنجليزية</option>
        <option>الهندية</option>
        <option>الأردية</option>
        <option>الفارسية</option>
        <option>الصينية</option>
        <option>البنغالية</option>
        <option>التركية</option>
        <option>الفرنسية</option>
        <option>الإسبانية</option>
        <option>الألمانية</option>
        <option>اليابانية</option>
        <option>الكورية</option>
        <option>الهولندية</option>
        <option>العبرية</option>
      </select>
      
      <div class="inter1">
        <button type="button" class="reg">حفظ</button>
      </div>
      
      <div class="inter">
        <button type="button" class="upa">تحديث</button>
        <button type="button" class="del">حذف</button>
        <button type="button" class="cel">مسح</button>
      </div>
    </div>
  </div>

  <script type="module" src="auth-guard.js"></script>
  <script type="module" src="user-bar.js"></script>
  <script type="module" src="/Langdex/script.js"></script>
</body>
</html>
