<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-content="CONTENT-TYPE" content="text/html; charset=UTF-8">
  <title>Langdex - البحث والإضافة</title>

  <!-- CSS -->
  <link rel="stylesheet" href="/Langdex/style.css">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    /* الإعدادات الأساسية للكمبيوتر والشاشات الكبيرة */
    .content {
      padding: 0 15px !important;
      box-sizing: border-box !important;
    }

    .content > div {
      width: 100% !important;
      max-width: 450px !important;
      margin: 25px auto !important;
      box-sizing: border-box !important;
    }

    /* تثبيت اللون الموحد لقسم البحث وفورم تسجيل الكلمات */
    .search-section,
    .form {
      background: #678071 !important;
      padding: 20px !important;
      border-radius: 10px !important;
      border: 1px solid rgba(255, 255, 255, 0.2) !important;
      box-sizing: border-box !important;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
    }

    /* عناوين الأقسام */
    .search-section h1,
    .form h1 {
      text-align: center;
      color: #ffffff;
      margin-bottom: 15px;
      font-size: 22px;
    }

    /* تنسيق حقول الإدخال والقوائم المنسدلة */
    .search-section input.search-txt,
    .form input,
    .form select {
      width: 100% !important;
      box-sizing: border-box !important;
      font-family: 'Cairo', sans-serif !important;
      border-radius: 8px !important;
      font-size: 14px !important;
    }

    .form select, .form input {
      padding: 12px;
      background: #ffffff;
      border: 1px solid #ccc;
      color: #000;
      margin-top: 10px;
    }

    /* زر الحفظ وزر مسح الحقول */
    .inter1 {
      display: flex !important;
      gap: 8px !important;
      width: 100% !important;
      box-sizing: border-box !important;
    }

    .inter1 button {
      flex: 1 !important;
      margin-top: 12px !important;
      padding: 12px 5px !important;
      border: none !important;
      border-radius: 8px !important;
      font-weight: bold !important;
      cursor: pointer !important;
      font-family: 'Cairo', sans-serif !important;
      color: white !important;
      font-size: 14px !important;
      text-align: center;
    }

    .inter1 .reg { background: #27ae60; }
    .inter1 .reg:hover { background: #219653; }
    
    .inter1 .cel { background: #7f8c8d; }
    .inter1 .cel:hover { background: #626d6e; }

    .search-btn {
      width: 100%;
      background: #00bcd4;
      color: white;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
      font-family: 'Cairo', sans-serif;
      font-size: 14px;
    }
    .search-btn:hover { background: #008ba3; }

    .search-result {
      color: #fff;
      margin-top: 10px;
      text-align: center;
    }

    /* جدول عرض النتائج العامة أسفل الصفحة */
    .table-container {
      width: 100% !important;
      max-width: 900px !important;
      background: #ffffff;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      overflow-x: auto;
      margin: 30px auto !important;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
      text-align: right;
    }

    th, td {
      border: 1px solid #ddd;
      padding: 10px;
      font-size: 14px;
    }

    th {
      background-color: #678071;
      color: white;
    }

    tr:nth-child(even) {
      background-color: #f9f9f9;
    }

    /* تعديلات الموبايل */
    @media (max-width: 768px) {
      .content {
        padding: 0 10px !important;
      }
      .content > div, .table-container {
        width: 100% !important;
        margin: 15px auto !important;
        padding: 15px !important;
      }
    }
  </style>
</head>

<body>

  <!-- ==================================================
       HEADER
  ================================================== -->
  <header>
    <div class="user-bar">
      <span id="username">مرحباً، User</span>
      <button id="logout-btn">تسجيل الخروج</button>
    </div>

    <nav class="bar">
      <ul>
        <a href="index.html"><li>الرئيسية</li></a> 
        <a href="/Langdex/data.html"><li>البيانات</li></a> 
        <a href="#"><li>حول</li></a>
        <a href="#"><li>استكشاف</li></a>
        <a href="#"><li>التواصل</li></a>
      </ul>
    </nav>
  </header>


  <!-- ==================================================
       CONTENT (بحث وإضافة)
  ================================================== -->
  <div class="content">

    <!-- قسم البحث والفلترة -->
    <div class="search-section">
      <h1>البحث العام</h1>
      <input type="text" id="search-input" placeholder="اكتب كلمة للبحث..." class="search-txt">
      
      <select id="language-filter">
        <option value="all">جميع اللغات</option>
      </select>

      <button type="button" class="search-btn">بحث</button>
      <button type="button" id="clear-filter" class="search-btn" style="background: #7f8c8d; margin-top: 5px;">إلغاء الفلتر</button>
      <div class="search-result"></div>
    </div>

    <!-- فورم تسجيل كلمة جديدة (إضافة فقط بدون تحديث أو حذف) -->
    <div class="form"> 
      <h1>تسجيل كلمة جديدة</h1>
      <input type="text" placeholder="ID" class="id" readonly="">
      <input type="text" placeholder="الكلمة" class="word-input">
      <input type="text" placeholder="المعنى" class="meaning-input">
      <input type="text" placeholder="المرادف" class="synonyms-input">
      <select class="language-select">
        <option value="" disabled selected>اختر اللغة</option>
        <option hidden>English</option>
        <option hidden>Hindi</option>
        <option hidden>Urdu</option>
        <option hidden>Persian</option>
        <option hidden>Chinese</option>
        <option hidden>Bengali</option>
        <option hidden>Turkish</option>
        <option hidden>French</option>
        <option hidden>Spanish</option>
        <option hidden>German</option>
        <option hidden>Japanese</option>
        <option hidden>Korean</option>
        <option hidden>Dutch</option>
        <option hidden>Hebrew</option>
        <option>الإنجليزية</option>
        <option>الهندية</option>
        <option>الأردية</option>
        <option>الفارسية</option>
        <option>الصينية</option>
        <option>البنغالية</option>
        <option>التركية</option>
        <option>الفرنسية</option>
        <option>الإسبانية</option>
        <option>الألمانية</option>
        <option>اليابانية</option>
        <option>الكورية</option>
        <option>الهولندية</option>
        <option>العبرية</option>
      </select>
      
      <div class="inter1">
        <button type="button" class="reg">حفظ</button>
        <button type="button" class="cel">مسح</button>
      </div>
    </div>

  </div>

  <!-- جدول عرض النتائج العامة -->
  <div class="table-container">
    <h3 style="margin-top: 0; color: #333;">القاموس العام (كل الكلمات)</h3>
    <table>
      <thead>
        <tr>
          <th>#</th>
          <th>الكلمة</th>
          <th>المعنى</th>
          <th>المرادف</th>
          <th>اللغة</th>
        </tr>
      </thead>
      <tbody id="data-table">
        <!-- البيانات ستعرض هنا ديناميكياً -->
      </tbody>
    </table>
  </div>


  <!-- ==================================================
       JAVASCRIPT
  ================================================== -->
  <script type="module" src="auth-guard.js"></script>
  <script type="module" src="user-bar.js"></script>
  <script type="module" src="/Langdex/index-script.js"></script>

</body>

</html>
