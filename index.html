<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<script src="[https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js](https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js)"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-content="CONTENT-TYPE" content="text/html; charset=UTF-8">
  <title>Home</title>

  <!-- CSS -->
  <link rel="stylesheet" href="/Langdex/style.css">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- مكتبة jsPDF لتصدير الـ PDF مع دعم الحروف العربية -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <style>
    .content {
      padding: 0 15px !important;
      box-sizing: border-box !important;
    }

    .content > div,
    .search-section,
    .data-section {
      width: 100% !important;
      max-width: 850px !important;
      margin: 15px auto !important;
      box-sizing: border-box !important;
    }

    .search-section,
    .data-section {
      background: #678071 !important;
      padding: 20px !important;
      border-radius: 10px !important;
      border: 1px solid rgba(255, 255, 255, 0.2) !important;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
    }

    .search-section h1,
    .data-section h1 {
      text-align: center;
      color: #ffffff;
      margin-bottom: 15px;
      font-size: 20px;
    }

    .search-section input.search-txt,
    .search-section select.filter-select {
      display: block !important;
      width: 100% !important;
      max-width: 450px !important;
      margin: 10px auto !important;
      box-sizing: border-box !important;
      font-family: 'Cairo', sans-serif !important;
      border-radius: 8px !important;
      padding: 12px !important;
      font-size: 14px !important;
      background: #ffffff !important;
      border: 1px solid #ccc !important;
      color: #000000 !important;
    }

    .search-btn,
    .pdf-btn {
      display: block !important;
      width: 100% !important;
      max-width: 450px !important;
      color: white;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      margin: 10px auto 0 auto !important;
      font-family: 'Cairo', sans-serif;
      font-size: 14px;
      transition: 0.2s;
      text-align: center;
    }
    
    .search-btn { background: #00bcd4; }
    .search-btn:hover { background: #008ba3; }

    .clear-btn { background: #7f8c8d !important; }
    .clear-btn:hover { background: #626d6e !important; }

    .pdf-btn { background: #e67e22 !important; }
    .pdf-btn:hover { background: #d35400 !important; }

    .search-result {
      color: #fff;
      margin-top: 10px;
      text-align: center;
      font-size: 14px;
    }

    .table-container {
      width: 100% !important;
      margin: 0 auto !important;
      overflow-x: auto;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      background: rgba(0, 0, 0, 0.15);
      border-radius: 8px;
      overflow: hidden;
    }
    th, td {
      padding: 10px 8px;
      text-align: center;
      font-size: 13px;
      color: #fff;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    th {
      background: rgba(0, 0, 0, 0.25);
      font-weight: bold;
    }

    /* تعديلات الموبايل وتوسيط الكاردز بالكامل */
    @media (max-width: 768px) {
      .content {
        padding: 0 10px !important;
      }
      .content > div,
      .search-section,
      .data-section {
        width: 100% !important;
        margin: 10px auto !important;
        padding: 15px !important;
      }

      .search-section input.search-txt,
      .search-section select.filter-select,
      .search-btn,
      .pdf-btn {
        max-width: 100% !important;
      }

      .table-container table, 
      .table-container thead, 
      .table-container tbody, 
      .table-container th, 
      .table-container td, 
      .table-container tr {
        display: block !important;
        width: 100% !important;
        box-sizing: border-box !important;
      }
      .table-container thead { display: none !important; }
      
      .table-container tr {
        background: rgba(255, 255, 255, 0.08);
        margin: 0 auto 12px auto !important;
        max-width: 450px !important;
        border-radius: 10px;
        padding: 12px;
        border: 1px solid rgba(255, 255, 255, 0.2);
        box-shadow: 0 4px 10px rgba(0,0,0,0.15);
      }

      .table-container td {
        display: flex !important;
        justify-content: space-between !important;
        align-items: center !important;
        text-align: right !important;
        padding: 8px 6px !important;
        font-size: 13px !important;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      }
      .table-container td:last-child {
        border-bottom: none !important;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="user-bar">
      <span id="username">مرحباً، User</span>
      <button id="logout-btn">تسجيل الخروج</button>
    </div>

    <nav class="bar">
      <ul>
        <a href="index.html"><li>الرئيسية</li></a> 
        <a href="/Langdex/data.html"><li>البيانات</li></a> 
        <a href="#"><li>حول</li></a>
        <a href="#"><li>استكشاف</li></a>
        <a href="#"><li>التواصل</li></a>
      </ul>
    </nav>
  </header>

  <div class="content">
    <div class="search-section">
      <h1>بحث عام</h1>
      <input type="text" id="search-input" placeholder="اكتب للبحث في كل الكلمات..." class="search-txt">
      
      <select id="language-filter" class="filter-select">
        <option value="all">جميع اللغات</option>
      </select>

      <button type="button" class="search-btn">بحث</button>
      <button type="button" id="clear-filter" class="search-btn clear-btn" style="margin-top: 5px;">إلغاء الفلتر</button>
      
      <!-- زر تحميل الـ PDF تحت الفلتر ومربوط بالنتيجة المعروضة -->
      <button type="button" id="download-pdf-btn" class="pdf-btn">تحميل البيانات المعروضة (PDF)</button>

      <div class="search-result"></div>
    </div>
  </div>

  <div class="content">
    <div class="data-section">
      <h1>جميع البيانات</h1>
      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th># ID</th>
              <th>الكلمة</th>
              <th>المعنى</th>
              <th>المرادف</th>
              <th>اللغة</th>
              <th>تاريخ التسجيل</th>
            </tr>
          </thead>
          <tbody id="data-table">
            <tr><td colspan="6" style="text-align: center;">جاري تحميل البيانات...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script type="module" src="auth-guard.js"></script>
  <script type="module" src="user-bar.js"></script>
  <script type="module" src="/Langdex/index-script.js"></script>

</body>

</html>
