<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-content="CONTENT-TYPE" content="text/html; charset=UTF-8">
  <title>Langdex - القاموس العام والبحث</title>

  <!-- CSS -->
  <link rel="stylesheet" href="/Langdex/style.css">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    /* الإعدادات العامة للكونتينر لتناسب الأقسام والجدول براحتهم */
    .content {
      padding: 0 15px !important;
      box-sizing: border-box !important;
    }

    /* الأقسام العامة تأخذ عرض مريح ومرن */
    .content > div,
    .search-section,
    .data-section {
      width: 100% !important;
      max-width: 850px !important;
      margin: 15px auto !important;
      box-sizing: border-box !important;
    }

    /* تثبيت لون الخلفية #678071 للأقسام الرئيسية */
    .search-section,
    .data-section {
      background: #678071 !important;
      padding: 20px !important;
      border-radius: 10px !important;
      border: 1px solid rgba(255, 255, 255, 0.2) !important;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
    }

    /* العناوين الداخلية */
    .search-section h1,
    .data-section h1 {
      text-align: center;
      color: #ffffff;
      margin-bottom: 15px;
      font-size: 20px;
    }

    /* تحجيم حقول الإدخال والـ Inputs لتكون ملمومة وفي المنتصف */
    .search-section input.search-txt,
    .search-section select.filter-select {
      display: block !important;
      width: 100% !important;
      max-width: 450px !important;
      margin: 10px auto !important;
      box-sizing: border-box !important;
      font-family: 'Cairo', sans-serif !important;
      border-radius: 8px !important;
      padding: 12px !important;
      font-size: 14px !important;
      background: #ffffff !important;
      border: 1px solid #ccc !important;
      color: #000000 !important;
    }

    /* أزرار البحث وإلغاء الفلتر */
    .search-btn {
      display: block !important;
      width: 100% !important;
      max-width: 450px !important;
      background: #00bcd4;
      color: white;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      margin: 10px auto 0 auto !important;
      font-family: 'Cairo', sans-serif;
      font-size: 14px;
      transition: 0.2s;
    }
    .search-btn:hover { background: #008ba3; }

    .clear-btn {
      background: #7f8c8d !important;
    }
    .clear-btn:hover {
      background: #626d6e !important;
    }

    .search-result {
      color: #fff;
      margin-top: 10px;
      text-align: center;
      font-size: 14px;
    }

    /* جدول عرض سجل البيانات (يأخذ راحته بالعرض المطلوب) */
    .table-container {
      width: 100% !important;
      margin: 0 auto !important;
      overflow-x: auto;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      background: rgba(0, 0, 0, 0.15);
      border-radius: 8px;
      overflow: hidden;
    }
    th, td {
      padding: 10px 8px;
      text-align: center;
      font-size: 13px;
      color: #fff;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    th {
      background: rgba(0, 0, 0, 0.25);
      font-weight: bold;
    }

    /* تعديلات الموبايل للتجاوب السلس */
    @media (max-width: 768px) {
      .content {
        padding: 0 10px !important;
      }
      .content > div,
      .search-section,
      .data-section {
        width: 100% !important;
        margin: 10px auto !important;
        padding: 15px !important;
      }

      .search-section input.search-txt,
      .search-section select.filter-select,
      .search-btn {
        max-width: 100% !important;
      }

      /* تحويل الجدول إلى كاردز منفصلة على الشاشات الصغيرة لسهولة التصفح */
      .table-container table, 
      .table-container thead, 
      .table-container tbody, 
      .table-container th, 
      .table-container td, 
      .table-container tr {
        display: block !important;
        width: 100% !important;
      }
      .table-container thead { display: none !important; }
      .table-container tr {
        background: rgba(255, 255, 255, 0.05);
        margin-bottom: 12px;
        border-radius: 8px;
        padding: 10px;
        border: 1px solid rgba(255, 255, 255, 0.15);
      }
      .table-container td {
        display: flex !important;
        justify-content: space-between !important;
        align-items: center !important;
        text-align: left !important;
        padding: 6px 4px !important;
        font-size: 13px !important;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      }
      .table-container td:last-child {
        border-bottom: none !important;
      }
    }
  </style>
</head>

<body>

  <!-- ==================================================
       HEADER
  ================================================== -->
  <header>
    <div class="user-bar">
      <span id="username">مرحباً، User</span>
      <button id="logout-btn">تسجيل الخروج</button>
    </div>

    <nav class="bar">
      <ul>
        <a href="index.html"><li>الرئيسية</li></a> 
        <a href="/Langdex/data.html"><li>البيانات</li></a> 
        <a href="#"><li>حول</li></a>
        <a href="#"><li>استكشاف</li></a>
        <a href="#"><li>التواصل</li></a>
      </ul>
    </nav>
  </header>


  <!-- ==================================================
       CONTENT (بحث وعرض عام فقط)
  ================================================== -->
  <div class="content">

    <!-- قسم البحث والفلترة العام -->
    <div class="search-section">
      <h1>القاموس العام والبحث</h1>
      <input type="text" id="search-input" placeholder="اكتب للبحث في كل الكلمات..." class="search-txt">
      
      <select id="language-filter" class="filter-select">
        <option value="all">جميع اللغات</option>
      </select>

      <button type="button" class="search-btn">بحث</button>
      <button type="button" id="clear-filter" class="search-btn clear-btn" style="margin-top: 5px;">إلغاء الفلتر</button>
      <div class="search-result"></div>
    </div>

  </div>

  <!-- جدول عرض كل الكلمات (القاموس العام مع الـ ID وتاريخ التسجيل وبواسطة مين) -->
  <div class="content">
    <div class="data-section">
      <h1>كل كلمات المنصة (القاموس العام)</h1>
      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th># ID</th>
              <th>بواسطة</th>
              <th>الكلمة</th>
              <th>المعنى</th>
              <th>المرادف</th>
              <th>اللغة</th>
              <th>تاريخ التسجيل</th>
            </tr>
          </thead>
          <tbody id="data-table">
            <tr><td colspan="7" style="text-align: center;">جاري تحميل البيانات...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>


  <!-- ==================================================
       JAVASCRIPT
  ================================================== -->
  <script type="module" src="auth-guard.js"></script>
  <script type="module" src="user-bar.js"></script>
  <script type="module" src="/Langdex/index-script.js"></script>

</body>

</html>
