<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-content="CONTENT-TYPE" content="text/html; charset=UTF-8">
  <title>Langdex</title>

  <!-- CSS -->
  <link rel="stylesheet" href="/Langdex/style.css">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    /* الإعدادات الأساسية للكمبيوتر والشاشات الكبيرة - جعل الصفحة ملمومة كارد في المنتصف */
    .content {
      padding: 0 15px !important;
      box-sizing: border-box !important;
    }

    .content > div {
      width: 100% !important;
      max-width: 450px !important; /* تصحيح العرض ليكون ملموماً واحترافياً مثل صفحات الدخول */
      margin: 25px auto !important;
      box-sizing: border-box !important;
    }

    /* تثبيت اللون الموحد #678071 لقسم البحث وفورم تسجيل الكلمات */
    .search-section,
    .form {
      background: #678071 !important;
      padding: 20px !important;
      border-radius: 10px !important;
      border: 1px solid rgba(255, 255, 255, 0.2) !important;
      box-sizing: border-box !important;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
    }

    /* عناوين الأقسام */
    .search-section h1,
    .form h1 {
      text-align: center;
      color: #ffffff;
      margin-bottom: 15px;
      font-size: 22px;
    }

    /* تنسيق حقول الإدخال والقوائم المنسدلة */
    .search-section input.search-txt,
    .form input,
    .form select {
      width: 100% !important;
      box-sizing: border-box !important;
      font-family: 'Cairo', sans-serif !important;
      border-radius: 8px !important;
      font-size: 14px !important;
    }

    .form select {
      padding: 12px;
      background: #ffffff;
      border: 1px solid #ccc;
      color: #000;
      margin-top: 10px;
    }

    .form input {
      padding: 12px;
      background: #ffffff;
      border: 1px solid #ccc;
      color: #000;
      margin-top: 10px;
    }

    /* تنسيق حاويات الأزرار لتكون متساوية ومظبوطة */
    .inter1, .inter {
      display: flex !important;
      gap: 8px !important;
      width: 100% !important;
      box-sizing: border-box !important;
    }

    .inter button, .inter1 button {
      flex: 1 !important;
      margin-top: 12px !important;
      padding: 12px 5px !important;
      border: none !important;
      border-radius: 8px !important;
      font-weight: bold !important;
      cursor: pointer !important;
      font-family: 'Cairo', sans-serif !important;
      color: white !important;
      font-size: 14px !important;
      text-align: center;
    }

    /* ألوان الأزرار المميزة */
    .inter1 .reg { background: #27ae60; }
    .inter1 .reg:hover { background: #219653; }
    
    .inter .upa { background: #2980b9; }
    .inter .upa:hover { background: #1f618d; }

    .inter .del { background: #c0392b; }
    .inter .del:hover { background: #962d22; }

    .inter .cel { background: #7f8c8d; }
    .inter .cel:hover { background: #626d6e; }

    .search-btn {
      width: 100%;
      background: #00bcd4;
      color: white;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
      font-family: 'Cairo', sans-serif;
      font-size: 14px;
    }
    .search-btn:hover { background: #008ba3; }

    .search-result {
      color: #fff;
      margin-top: 10px;
      text-align: center;
    }

    /* تعديلات الموبايل لمنع أي لخبطة وتنظيم الأزرار بذكاء */
    @media (max-width: 768px) {
      .content {
        padding: 0 10px !important;
      }
      .content > div {
        width: 100% !important;
        margin: 15px auto !important;
        padding: 15px !important;
      }
      
      /* الأزرار الثلاثة متساوية تماماً وجنب بعض على الموبايل */
      .inter {
        display: flex !important;
        gap: 6px !important;
      }
      
      .inter button {
        padding: 10px 4px !important;
        font-size: 12px !important;
      }
    }
  </style>
</head>

<body>

  <!-- ==================================================
       HEADER
  ================================================== -->
  <header>
    <div class="user-bar">
      <span id="username">مرحباً، User</span>
      <button id="logout-btn">تسجيل الخروج</button>
    </div>

    <nav class="bar">
      <ul>
        <a href="#"><li>الرئيسية</li></a> 
        <a href="/Langdex/data.html"><li>البيانات</li></a> 
        <a href="#"><li>حول</li></a>
        <a href="#"><li>استكشاف</li></a>
        <a href="#"><li>التواصل</li></a>
      </ul>
    </nav>
  </header>


  <!-- ==================================================
       CONTENT
  ================================================== -->
  <div class="content">

    <!-- قسم البحث -->
    <div class="search-section">
      <h1>البحث</h1>
      <input type="text" placeholder="اكتب كلمة" class="search-txt">
      <button type="button" class="search-btn">بحث</button>
      <div class="search-result"></div>
    </div>

    <!-- فورم تسجيل الكلمات -->
    <div class="form"> 
      <h1>تسجيل كلمة جديدة</h1>
      <input type="text" placeholder="ID" class="id" readonly="">
      <input type="text" placeholder="الكلمة">
      <input type="text" placeholder="المعنى">
      <input type="text" placeholder="المرادف">
      <select>
        <option value="" disabled selected>اختر اللغة</option>
        <option hidden>English</option>
        <option hidden>Hindi</option>
        <option hidden>Urdu</option>
        <option hidden>Persian</option>
        <option hidden>Chinese</option>
        <option hidden>Bengali</option>
        <option hidden>Turkish</option>
        <option hidden>French</option>
        <option hidden>Spanish</option>
        <option hidden>German</option>
        <option hidden>Japanese</option>
        <option hidden>Korean</option>
        <option hidden>Dutch</option>
        <option hidden>Hebrew</option>
        <option>الإنجليزية</option>
        <option>الهندية</option>
        <option>الأردية</option>
        <option>الفارسية</option>
        <option>الصينية</option>
        <option>البنغالية</option>
        <option>التركية</option>
        <option>الفرنسية</option>
        <option>الإسبانية</option>
        <option>الألمانية</option>
        <option>اليابانية</option>
        <option>الكورية</option>
        <option>الهولندية</option>
        <option>العبرية</option>
      </select>
      
      <div class="inter1">
        <button type="button" class="reg">حفظ</button>
      </div>
      
      <div class="inter">
        <button type="button" class="upa">تحديث</button>
        <button type="button" class="del">حذف</button>
        <button type="button" class="cel">مسح</button>
      </div>
    </div>

  </div>


  <!-- ==================================================
       JAVASCRIPT
  ================================================== -->
  <script type="module" src="auth-guard.js"></script>
  <script type="module" src="user-bar.js"></script>
  <script type="module" src="/Langdex/script.js"></script>

</body>

</html>
