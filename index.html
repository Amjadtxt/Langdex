<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-content="CONTENT-TYPE" content="text/html; charset=UTF-8">
  <title>Langdex - القاموس العام والبحث</title>

  <!-- CSS -->
  <link rel="stylesheet" href="/Langdex/style.css">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    /* الإعدادات الأساسية للكمبيوتر والشاشات الكبيرة */
    .content {
      padding: 0 15px !important;
      box-sizing: border-box !important;
      max-width: 500px !important;
      margin: 25px auto !important;
    }

    /* تثبيت اللون الموحد #678071 لقسم البحث العام */
    .search-section {
      background: #678071 !important;
      padding: 20px !important;
      border-radius: 10px !important;
      border: 1px solid rgba(255, 255, 255, 0.2) !important;
      box-sizing: border-box !important;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
    }

    /* عنوان القسم */
    .search-section h1 {
      text-align: center;
      color: #ffffff;
      margin-bottom: 15px;
      font-size: 22px;
    }

    /* تنسيق حقول الإدخال والقوائم المنسدلة للبحث */
    .search-section input.search-txt,
    .search-section select {
      width: 100% !important;
      box-sizing: border-box !important;
      font-family: 'Cairo', sans-serif !important;
      border-radius: 8px !important;
      font-size: 14px !important;
      padding: 12px;
      background: #ffffff;
      border: 1px solid #ccc;
      color: #000;
      margin-top: 10px;
    }

    .search-btn {
      width: 100%;
      background: #00bcd4;
      color: white;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
      font-family: 'Cairo', sans-serif;
      font-size: 14px;
    }
    .search-btn:hover { background: #008ba3; }

    .search-result {
      color: #fff;
      margin-top: 10px;
      text-align: center;
    }

    /* تنسيق جدول عرض النتائج العامة الشامل */
    .table-container {
      width: 100% !important;
      max-width: 1000px !important;
      background: #ffffff;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      overflow-x: auto;
      margin: 30px auto !important;
      box-sizing: border-box;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
      text-align: right;
    }

    th, td {
      border: 1px solid #ddd;
      padding: 10px;
      font-size: 14px;
    }

    th {
      background-color: #678071;
      color: white;
    }

    tr:nth-child(even) {
      background-color: #f9f9f9;
    }

    /* تعديلات الموبايل */
    @media (max-width: 768px) {
      .content {
        padding: 0 10px !important;
      }
      .content, .table-container {
        width: 100% !important;
        margin: 15px auto !important;
        padding: 15px !important;
      }
    }
  </style>
</head>

<body>

  <!-- ==================================================
       HEADER
  ================================================== -->
  <header>
    <div class="user-bar">
      <span id="username">مرحباً، User</span>
      <button id="logout-btn">تسجيل الخروج</button>
    </div>

    <nav class="bar">
      <ul>
        <a href="index.html"><li>الرئيسية</li></a> 
        <a href="/Langdex/data.html"><li>البيانات</li></a> 
        <a href="#"><li>حول</li></a>
        <a href="#"><li>استكشاف</li></a>
        <a href="#"><li>التواصل</li></a>
      </ul>
    </nav>
  </header>


  <!-- ==================================================
       CONTENT (بحث وعرض عام فقط)
  ================================================== -->
  <div class="content">

    <!-- قسم البحث والفلترة العام -->
    <div class="search-section">
      <h1>القاموس العام والبحث</h1>
      <input type="text" id="search-input" placeholder="اكتب للبحث في كل الكلمات..." class="search-txt">
      
      <select id="language-filter">
        <option value="all">جميع اللغات</option>
      </select>

      <button type="button" class="search-btn">بحث</button>
      <button type="button" id="clear-filter" class="search-btn" style="background: #7f8c8d; margin-top: 5px;">إلغاء الفلتر</button>
      <div class="search-result"></div>
    </div>

  </div>

  <!-- جدول عرض كل الكلمات (القاموس العام مع الـ ID وتاريخ التسجيل) -->
  <div class="table-container">
    <h3 style="margin-top: 0; color: #333;">كل كلمات المنصة (القاموس العام)</h3>
    <table>
      <thead>
        <tr>
          <th># ID</th>
          <th>الكلمة</th>
          <th>المعنى</th>
          <th>المرادف</th>
          <th>اللغة</th>
          <th>تاريخ التسجيل</th>
        </tr>
      </thead>
      <tbody id="data-table">
        <!-- البيانات ستعرض هنا ديناميكياً بواسطة index-script.js -->
      </tbody>
    </table>
  </div>


  <!-- ==================================================
       JAVASCRIPT
  ================================================== -->
  <script type="module" src="auth-guard.js"></script>
  <script type="module" src="user-bar.js"></script>
  <script type="module" src="/Langdex/index-script.js"></script>

</body>

</html>
