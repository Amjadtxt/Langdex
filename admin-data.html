<!DOCTYPE html>

<html lang="ar" dir="rtl">

<head>

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <meta http-equiv="CONTENT-TYPE"
        content="text/html; charset=UTF-8">

  <title>All Data</title>


  <!-- CSS -->

  <link rel="stylesheet"
        href="/Langdex/style.css">


  <!-- Google Fonts -->

  <link rel="preconnect"
        href="https://fonts.googleapis.com">

  <link rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap"
    rel="stylesheet">
<style>
    html {
        visibility: hidden;
    }
</style>

</head>


<body>


  <!-- ==================================================
       HEADER
  ================================================== -->

  <header>
<div class="user-bar">
    <span id="username">مرحباً، User</span>

    <button id="logout-btn">تسجيل الخروج</button>
</div>
    <nav class="bar">

      <ul>

        <a href="/Langdex/admin.html">
          <li>الرئيسية</li>
        </a>

        <a href="#">
          <li>البيانات</li>
        </a>

        <a href="#">
          <li>حول</li>
        </a>

        <a href="#">
          <li>استكشاف</li>
        </a>

        <a href="#">
          <li>التواصل</li>
        </a>

      </ul>

    </nav>

  </header>
  <div class="content2">
    <section class="data-section">
      <h1>
        جميع البيانات
      </h1>
      <div class="data-controls">
        <!-- LANGUAGE FILTER -->
        <select id="language-filter" class="language-filter">
          <option value="all">
            جميع اللغات
          </option>
        </select>
            <div class="cntrl">
                  <button
        type="button"
        class="show-data">
        عرض البيانات
      </button>
        <button
          type="button"
          id="clear-filter" class="clear-filter">
          إلغاء الفلتر
        </button>
        <button
          type="button"
          id="download-pdf" class="download-pdf">
          تحميل PDF
        </button>
                  </div>
      </div>


      <!-- ==================================================
           TABLE
      ================================================== -->

      <div class="table-container">

        <table id="words-table">

          <thead>

            <tr>

              <th>ID</th>

              <th>الكلمة</th>

              <th>المعنى</th>

              <th>المرادف</th>

              <th>اللغة</th>

            </tr>

          </thead>


          <tbody id="data-table">

          </tbody>

        </table>

      </div>


    </section>

  </div>


  <!-- ==================================================
       PDF LIBRARIES (FIXED FOR FULL COMPATIBILITY)
  ================================================== -->

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>


  <!-- ==================================================
       JAVASCRIPT
  ================================================== -->
<script type="module" src="auth-guard.js"></script>
<script type="module" src="user-bar.js"></script>
  <script
    type="module"
    src="/Langdex/script.js">
  </script>

</body>

</html>
