<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-content="CONTENT-TYPE" content="text/html; charset=UTF-8">
  <title>Langdex - Flashcards Quiz</title>

  <!-- CSS -->
  <link rel="stylesheet" href="/Langdex/style.css">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    .content {
      padding: 0 15px !important;
      box-sizing: border-box !important;
    }

    .content > div,
    .quiz-section {
      width: 100% !important;
      max-width: 850px !important;
      margin: 15px auto !important;
      box-sizing: border-box !important;
    }

    .quiz-section {
      background: #678071 !important;
      padding: 25px !important;
      border-radius: 10px !important;
      border: 1px solid rgba(255, 255, 255, 0.2) !important;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
      text-align: center;
    }

    .quiz-section h1 {
      color: #ffffff;
      margin-bottom: 20px;
      font-size: 22px;
    }

    .flashcard {
      width: 100%;
      max-width: 450px;
      height: 250px;
      margin: 0 auto 20px auto;
      perspective: 1000px;
      cursor: pointer;
    }

    .flashcard-inner {
      position: relative;
      width: 100%;
      height: 100%;
      text-align: center;
      transition: transform 0.6s;
      transform-style: preserve-3d;
      border-radius: 12px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
    }

    .flashcard.flipped .flashcard-inner {
      transform: rotateY(180deg);
    }

    .flashcard-front, .flashcard-back {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      border-radius: 12px;
      padding: 20px;
      box-sizing: border-box;
      font-family: 'Cairo', sans-serif;
    }

    .flashcard-front {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
    }

    .flashcard-front h2 {
      font-size: 28px;
      color: #00bcd4;
      margin-bottom: 10px;
    }

    .flashcard-front span {
      font-size: 14px;
      color: #ddd;
    }

    .flashcard-back {
      background: #2a2a2a;
      color: #fff;
      transform: rotateY(180deg);
      border: 1px solid rgba(0, 188, 212, 0.4);
    }

    .flashcard-back h2 {
      font-size: 24px;
      color: #27ae60;
      margin-bottom: 10px;
    }

    .flashcard-back p {
      font-size: 14px;
      color: #ccc;
      margin: 5px 0;
    }

    .quiz-controls {
      display: flex;
      gap: 10px;
      max-width: 450px;
      margin: 0 auto;
    }

    .quiz-controls button {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      font-family: 'Cairo', sans-serif;
      color: white;
      font-size: 14px;
      transition: 0.2s;
    }

    .btn-next { background: #2980b9; }
    .btn-next:hover { background: #1f618d; }

    .btn-flip { background: #27ae60; }
    .btn-flip:hover { background: #219653; }

    .quiz-progress {
      color: #fff;
      font-size: 14px;
      margin-bottom: 15px;
    }

    @media (max-width: 768px) {
      .quiz-section { padding: 15px !important; }
      .flashcard { height: 220px; }
    }
  </style>
</head>

<body>

  <header>
    <div class="user-bar">
      <span id="username">مرحباً، User</span>
      <button id="logout-btn">تسجيل الخروج</button>
    </div>

    <nav class="bar">
      <ul>
        <a href="/Langdex/admin.html"><li>الرئيسية</li></a>
        <a href="/Langdex/admin-manage.html"><li>إدارة</li></a>
        <a href="/Langdex/users.html"><li>المستخدمين</li></a>
        <a href="/Langdex/flashcards.html"><li style="color: #00bcd4;">اختبارات الحفظ</li></a>
      </ul>
    </nav>
  </header>

  <div class="content">
    <div class="quiz-section">
      <h1>اختبارات الحفظ (Flashcards)</h1>
      <div class="quiz-progress" id="quizProgress">جاري تحميل كلماتك...</div>

      <div class="flashcard" id="flashcard">
        <div class="flashcard-inner">
          <div class="flashcard-front">
            <h2 id="cardWord">-</h2>
            <span>(اضغط لمعرفة المعنى)</span>
          </div>
          <div class="flashcard-back">
            <h2 id="cardMeaning">-</h2>
            <p id="cardSynonym">المرادف: -</p>
            <p id="cardLang">اللغة: -</p>
          </div>
        </div>
      </div>

      <div class="quiz-controls">
        <button type="button" class="btn-flip" id="flipBtn">قلب البطاقة</button>
        <button type="button" class="btn-next" id="nextBtn">الكلمة التالية ➡</button>
      </div>
    </div>
  </div>

  <!-- ملف الجافاسكريبت المنفصل لجلب كلمات اليوزر الحالي -->
  <script type="module" src="/Langdex/auth-guard.js"></script>
  <script type="module" src="/Langdex/user-bar.js"></script>
  <script type="module" src="/Langdex/flashcards.js"></script>

</body>

</html>
