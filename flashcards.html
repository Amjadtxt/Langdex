<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-content="CONTENT-TYPE" content="text/html; charset=UTF-8">
  <title>Langdex - Quiz</title>

  <!-- CSS -->
  <link rel="stylesheet" href="/Langdex/style.css">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    .content {
      padding: 0 15px !important;
      box-sizing: border-box !important;
    }

    .content > div,
    .quiz-section {
      width: 100% !important;
      max-width: 850px !important;
      margin: 15px auto !important;
      box-sizing: border-box !important;
    }

    .quiz-section {
      background: #678071 !important;
      padding: 25px !important;
      border-radius: 10px !important;
      border: 1px solid rgba(255, 255, 255, 0.2) !important;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
      text-align: center;
    }

    .quiz-section h1 {
      color: #ffffff;
      margin-bottom: 20px;
      font-size: 22px;
    }

    .question-box {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 10px;
      padding: 20px;
      margin-bottom: 20px;
      text-align: center;
    }

    .question-box h2 {
      font-size: 26px;
      color: #00bcd4;
      margin-bottom: 8px;
    }

    .question-box p {
      font-size: 14px;
      color: #ddd;
      margin: 0;
    }

    .options-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-width: 450px;
      margin: 0 auto;
    }

    .option-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      padding: 12px;
      color: #fff;
      font-family: 'Cairo', sans-serif;
      font-size: 15px;
      cursor: pointer;
      transition: 0.2s;
      text-align: center;
    }

    .option-btn:hover {
      background: rgba(255, 255, 255, 0.18);
    }

    .option-btn.correct {
      background: #27ae60 !important;
      border-color: #2ecc71 !important;
    }

    .option-btn.wrong {
      background: #c0392b !important;
      border-color: #e74c3c !important;
    }

    .quiz-controls {
      display: flex;
      gap: 10px;
      max-width: 450px;
      margin: 20px auto 0 auto;
    }

    .btn-next {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      font-family: 'Cairo', sans-serif;
      color: white;
      font-size: 14px;
      background: #2980b9;
      transition: 0.2s;
    }

    .btn-next:hover {
      background: #1f618d;
    }

    .quiz-progress {
      color: #fff;
      font-size: 14px;
      margin-bottom: 15px;
    }

    @media (max-width: 768px) {
      .quiz-section { padding: 15px !important; }
    }
  </style>
</head>

<body>

  <header>
    <div class="user-bar">
      <span id="username">مرحباً، User</span>
      <button id="logout-btn">تسجيل الخروج</button>
    </div>

    <nav class="bar">
      <ul>
        <a href="/Langdex/admin.html"><li>الرئيسية</li></a>
        <a href="/Langdex/admin-manage.html"><li>إدارة</li></a>
        <a href="/Langdex/users.html"><li>المستخدمين</li></a>
        <a href="/Langdex/flashcards.html"><li style="color: #00bcd4;">اختبارات الحفظ</li></a>
      </ul>
    </nav>
  </header>

  <div class="content">
    <div class="quiz-section">
      <h1>اختبار الكلمات (اختر الإجابة الصحيحة)</h1>
      <div class="quiz-progress" id="quizProgress">جاري تحضير الاختبار...</div>

      <div class="question-box">
        <h2 id="questionTitle">-</h2>
        <p id="questionSub">ما هو المعنى الصحيح لهذه الكلمة؟</p>
      </div>

      <div class="options-container" id="optionsContainer">
        <!-- سيتم توليد الاختيارات ديناميكياً هنا -->
      </div>

      <div class="quiz-controls">
        <button type="button" class="btn-next" id="nextQuizBtn" style="display: none;">السؤال التالي ➡</button>
      </div>
    </div>
  </div>

  <!-- سكربتات النظام والملف المنفصل -->
  <script type="module" src="/Langdex/auth-guard.js"></script>
  <script type="module" src="/Langdex/user-bar.js"></script>
  <script type="module" src="/Langdex/flashcards.js"></script>

</body>

</html>
