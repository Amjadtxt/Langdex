<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login</title>

  <link rel="stylesheet" href="/Langdex/style.css">

  <!-- Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap"
    rel="stylesheet">

  <style>
    /* الإعدادات الأساسية للكمبيوتر والشاشات الكبيرة */
    .content > div {
      width: 85% !important;
      max-width: 850px !important;
      margin: 15px auto !important;
      box-sizing: border-box !important;
    }

    /* تثبيت اللون الموحد #678071 لفورم تسجيل الدخول */
    .login-form {
      background: #678071 !important;
      padding: 20px !important;
      border-radius: 8px !important;
      border: 1px solid rgba(255, 255, 255, 0.2) !important;
      margin-bottom: 15px !important;
      box-sizing: border-box !important;
      width: 100% !important;
    }

    /* تنسيق حقول الإدخال والزر */
    .login-form input.loginput {
      width: 100% !important;
      box-sizing: border-box !important;
      font-family: 'Cairo', sans-serif !important;
      border-radius: 8px !important;
      padding: 12px !important;
      background: #ffffff !important;
      border: 1px solid #ccc !important;
      color: #000 !important;
      margin-top: 10px !important;
    }

    .login-form .loginbut {
      width: 100% !important;
      box-sizing: border-box !important;
      margin-top: 15px !important;
      padding: 12px 10px !important;
      border: none !important;
      border-radius: 8px !important;
      font-weight: bold !important;
      cursor: pointer !important;
      font-family: 'Cairo', sans-serif !important;
      color: white !important;
      background: #27ae60 !important;
      font-size: 14px !important;
      transition: 0.2s !important;
    }

    .login-form .loginbut:hover {
      background: #219653 !important;
    }

    /* تعديلات الموبايل للتجاوب السلس */
    @media (max-width: 768px) {
      .content > div {
        width: 94% !important;
        margin: 10px auto !important;
        padding: 12px !important;
      }
      .login-form {
        padding: 15px !important;
      }
    }
  </style>
</head>

<body>

  <!-- HEADER -->

  <header>

    <nav class="bar">

      <ul>

        <a href="/Langdex/index.html">
          <li>الرئيسية</li>
        </a>

        <a href="/Langdex/data.html">
          <li>البيانات</li>
        </a>

        <a href="#">
          <li>حول</li>
        </a>

        <a href="#">
          <li>استكشاف</li>
        </a>

        <a href="#">
          <li>التواصل</li>
        </a>

      </ul>

    </nav>

  </header>


  <!-- LOGIN -->

  <div class="content">

    <div class="login-form">

      <h1>تسجيل الدخول</h1>

      <input class="loginput"
        type="email"
        id="login-email"
        placeholder="البريد الإلكتروني"
        autocomplete="email">

      <input class="loginput"
        type="password"
        id="login-password"
        placeholder="كلمة المرور"
        autocomplete="current-password">

      <button class="loginbut"
        type="button"
        id="login-btn">
        تسجيل الدخول
      </button>

      <p id="login-message"></p>

      <div class="login-links">

        <p>
          ليس لديك حساب؟
          <a href="/Langdex/register.html">
            إنشاء حساب
          </a>
        </p>

      </div>

    </div>

  </div>


  <!-- Firebase Login -->

  <script
    type="module"
    src="/Langdex/login.js">
  </script>

</body>

</html>
