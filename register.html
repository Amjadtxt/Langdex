<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Sign Up</title>

  <link rel="stylesheet"
        href="/Langdex/style.css">

  <link rel="preconnect"
        href="https://fonts.googleapis.com">

  <link rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap"
    rel="stylesheet">
</head>


<body>

  <header>

    <nav class="bar">

      <ul>

        <a href="/Langdex/index.html">
          <li>الرئيسية</li>
        </a>

        <a href="/Langdex/data.html">
          <li>البيانات</li>
        </a>

        <a href="#">
          <li>حول</li>
        </a>

        <a href="#">
          <li>استكشاف</li>
        </a>

        <a href="#">
          <li>التواصل</li>
        </a>

      </ul>

    </nav>

  </header>


  <div class="content">

    <div class="login-form">

      <h1>إنشاء حساب</h1>

      <input
        class="loginput"
        type="email"
        id="register-email"
        placeholder="البريد الإلكتروني"
        autocomplete="email">

      <input
        class="loginput"
        type="password"
        id="register-password"
        placeholder="كلمة المرور"
        autocomplete="new-password">

      <input
        class="loginput"
        type="password"
        id="register-confirm-password"
        placeholder="تأكيد كلمة المرور"
        autocomplete="new-password">

      <button
        class="loginbut"
        type="button"
        id="register-btn">
        إنشاء الحساب
      </button>

      <p id="register-message"></p>

      <div class="login-links">

        <p>
          لديك حساب بالفعل؟
          <a href="/Langdex/login.html">
            تسجيل الدخول
          </a>
        </p>

      </div>

    </div>

  </div>


  <script
    type="module"
    src="/Langdex/register.js">
  </script>

</body>

</html>
