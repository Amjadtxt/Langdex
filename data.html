<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-content="CONTENT-TYPE" content="text/html; charset=UTF-8">
  <title>Langdex - إدارة الكلمات الشخصية</title>

  <!-- CSS -->
  <link rel="stylesheet" href="/Langdex/style.css">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- مكتبة jsPDF لتصدير الـ PDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <style>
    .content {
      padding: 0 15px !important;
      box-sizing: border-box !important;
    }

    .content > div,
    .search-section,
    .form,
    .actions-top-bar,
    .data-section {
      width: 100% !important;
      max-width: 850px !important;
      margin: 15px auto !important;
      box-sizing: border-box !important;
    }

    .search-section,
    .form,
    .actions-top-bar,
    .data-section {
      background: #678071 !important;
      padding: 20px !important;
      border-radius: 10px !important;
      border: 1px solid rgba(255, 255, 255, 0.2) !important;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
    }

    .search-section h1,
    .form h1,
    .data-section h1 {
      text-align: center;
      color: #ffffff;
      margin-bottom: 15px;
      font-size: 20px;
    }

    .search-section input.search-txt,
    .search-section select.filter-select,
    .form input,
    .form select {
      display: block !important;
      width: 100% !important;
      max-width: 450px !important;
      margin: 10px auto !important;
      box-sizing: border-box !important;
      font-family: 'Cairo', sans-serif !important;
      border-radius: 8px !important;
      padding: 12px !important;
      font-size: 14px !important;
      background: #ffffff !important;
      border: 1px solid #ccc !important;
      color: #000000 !important;
    }

    .inter1 {
      display: flex !important;
      gap: 10px !important;
      width: 100% !important;
      max-width: 450px !important;
      margin: 15px auto 0 auto !important;
      box-sizing: border-box !important;
    }
    .inter1 button {
      flex: 1 !important;
      padding: 12px 5px !important;
      border: none !important;
      border-radius: 8px !important;
      font-weight: bold !important;
      cursor: pointer !important;
      font-family: 'Cairo', sans-serif !important;
      color: white !important;
      text-align: center !important;
      font-size: 14px !important;
      transition: 0.2s !important;
    }
    .inter1 .reg { background: #27ae60; }
    .inter1 .reg:hover { background: #219653; }
    
    .inter1 .upa { background: #2980b9; }
    .inter1 .upa:hover { background: #1f618d; }

    .inter1 .cel { background: #7f8c8d; }
    .inter1 .cel:hover { background: #626d6e; }

    .actions-top-bar {
      display: flex !important;
      gap: 10px !important;
      align-items: center !important;
      max-width: 850px !important;
    }
    .actions-top-bar button {
      flex: 1 !important;
      padding: 12px 10px !important;
      border: none !important;
      border-radius: 8px !important;
      font-weight: bold !important;
      cursor: pointer !important;
      font-family: 'Cairo', sans-serif !important;
      color: white !important;
      text-align: center !important;
      font-size: 14px !important;
      transition: 0.2s !important;
    }
    .pdf-btn { background: #e67e22; }
    .pdf-btn:hover { background: #d35400; }

    .table-container {
      width: 100% !important;
      margin: 0 auto !important;
      overflow-x: auto;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      background: rgba(0, 0, 0, 0.15);
      border-radius: 8px;
      overflow: hidden;
    }
    th, td {
      padding: 10px 8px;
      text-align: center;
      font-size: 13px;
      color: #fff;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    th {
      background: rgba(0, 0, 0, 0.25);
      font-weight: bold;
    }

    .table-container td button {
      display: inline-block;
      width: 70px;
      padding: 6px 0;
      margin: 2px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      font-family: 'Cairo', sans-serif;
      font-weight: bold;
      color: white;
      text-align: center;
      font-size: 12px;
    }
    .table-container td button:first-of-type { background-color: #2980b9; }
    .table-container td button:first-of-type:hover { background-color: #1f618d; }
    .table-container td button:last-of-type { background-color: #c0392b; }
    .table-container td button:last-of-type:hover { background-color: #962d22; }

    @media (max-width: 768px) {
      .content { padding: 0 10px !important; }
      .content > div, .search-section, .form, .actions-top-bar, .data-section {
        width: 100% !important; margin: 10px auto !important; padding: 15px !important;
      }
      .inter1, .actions-top-bar { flex-direction: column !important; gap: 8px !important; max-width: 100% !important; }
      .inter1 button, .actions-top-bar button { width: 100% !important; max-width: none !important; margin: 0 !important; }

      .table-container table, .table-container thead, .table-container tbody, .table-container th, .table-container td, .table-container tr {
        display: block !important; width: 100% !important;
      }
      .table-container thead { display: none !important; }
      .table-container tr {
        background: rgba(255, 255, 255, 0.05);
        margin-bottom: 12px;
        border-radius: 8px;
        padding: 10px;
        border: 1px solid rgba(255, 255, 255, 0.15);
      }
      .table-container td {
        display: flex !important; justify-content: space-between !important; align-items: center !important;
        text-align: left !important; padding: 6px 4px !important; font-size: 13px !important;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      }
      .table-container td:last-child {
        border-bottom: none !important; flex-direction: column !important; gap: 6px !important; padding-top: 8px !important;
      }
      .table-container td button { width: 100% !important; font-size: 13px !important; padding: 8px !important; margin: 0 !important; }
    }
  </style>
</head>

<body>

  <!-- ==================================================
       HEADER (محدث بالكامل حسب الصورة والخانات المطلوبة)
  ================================================== -->
  <header>
    <div class="user-bar">
      <span id="username">مرحباً، User</span>
      <button id="logout-btn">تسجيل الخروج</button>
    </div>

    <nav class="bar">
      <ul>
        <a href="index.html"><li>الرئيسية</li></a>
        <a href="Data.html"><li>البيانات</li></a>
        <a href="about.html"><li>حول</li></a>
        <a href="explore.html"><li>استكشاف</li></a>
        <a href="contact.html"><li>التواصل</li></a>
      </ul>
    </nav>
  </header>


  <!-- ==================================================
       DASHBOARD CONTENT (USER ONLY)
  ================================================== -->
  <div class="content">

    <!-- 1. قسم البحث وتحته الفلتر -->
    <div class="search-section">
      <h1>البحث في كلماتي</h1>
      <input type="text" id="search-input" class="search-txt" placeholder="ابحث برقم الـ ID، الكلمة، المعنى، أو المرادف...">
      <select id="language-filter" class="filter-select">
          <option value="all">كل اللغات</option>
      </select>
    </div>

    <!-- 2. فورم إضافة وتعديل الكلمات -->
    <div class="form">
      <h1>إدارة كلمة جديدة</h1>
      <input type="number" id="word-id" placeholder="ID الكلمة" readonly>
      <input type="text" id="word-input" placeholder="الكلمة">
      <input type="text" id="meaning-input" placeholder="المعنى">
      <input type="text" id="synonyms-input" placeholder="المرادف">
      <select id="formLanguageSelect">
          <option hidden value="">إختر اللغة</option>
          <option value="الإنجليزية">الإنجليزية</option>
          <option value="الهندية">الهندية</option>
          <option value="الأردية">الأردية</option>
          <option value="الفارسية">الفارسية</option>
          <option value="الصينية">الصينية</option>
          <option value="البنغالية">البنغالية</option>
          <option value="التركية">التركية</option>
          <option value="الفرنسية">الفرنسية</option>
          <option value="الإسبانية">الإسبانية</option>
          <option value="الألمانية">الألمانية</option>
          <option value="اليابانية">اليابانية</option>
          <option value="الكورية">الكورية</option>
          <option value="الهولندية">الهولندية</option>
          <option value="العبرية">العبرية</option>
      </select>
      
      <div class="inter1">
        <button type="button" class="reg" id="add-btn">إضافة كلمة جديدة</button>
        <button type="button" class="upa" id="update-btn">تعديل الكلمة المحددة</button>
        <button type="button" class="cel" id="clear-btn">مسح الحقول</button>
      </div>
    </div>

    <!-- 3. الأزرار العلوية (تحميل PDF الخاص بي) -->
    <div class="actions-top-bar">
      <button type="button" class="pdf-btn" id="downloadPdfBtn">تحميل بياناتي المعروضة (PDF)</button>
    </div>

    <!-- 4. جدول عرض السجل الشخصي للمستخدم فقط -->
    <div class="data-section">
      <h1>سجل كلماتي الشخصية</h1>
      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>الكلمة</th>
              <th>المعنى</th>
              <th>المرادف</th>
              <th>اللغة</th>
              <th>تاريخ التسجيل</th>
              <th>الإجراءات</th>
            </tr>
          </thead>
          <tbody id="data-table">
            <tr><td colspan="7" style="text-align: center;">جاري تحميل بياناتك...</td></tr>
          </tbody>
        </table>
      </div>
    </div>

  </div>


  <!-- ==================================================
       JAVASCRIPT
  ================================================== -->
  <script type="module" src="auth-guard.js"></script>
  <script type="module" src="user-bar.js"></script>
  <script type="module" src="/Langdex/data-script.js"></script>

</body>

</html>
