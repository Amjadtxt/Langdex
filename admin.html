<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-content="CONTENT-TYPE" content="text/html; charset=UTF-8">
  <title>Admin Dashboard</title>

  <!-- CSS -->
  <link rel="stylesheet" href="/Langdex/style.css">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- مكتبة jsPDF لتصدير الـ PDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <style>
    .content {
      padding: 0 15px !important;
      box-sizing: border-box !important;
    }

    .content > div,
    .cards-container,
    .search-section,
    .form,
    .actions-top-bar,
    .data-section {
      width: 100% !important;
      max-width: 850px !important;
      margin: 15px auto !important;
      box-sizing: border-box !important;
    }

    /* الكاردز الإحصائية */
    .cards-container {
      display: grid !important;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)) !important;
      gap: 12px !important;
    }

    .card {
      background: rgba(255, 255, 255, 0.05);
      padding: 15px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      text-align: center;
      box-sizing: border-box;
    }

    .card h3 {
      font-size: 13px;
      color: #aaa;
      margin-bottom: 5px;
    }

    .card p {
      font-size: 18px;
      font-weight: bold;
      color: #00bcd4;
      margin: 0;
    }

    /* خلفية #678071 للأقسام */
    .search-section,
    .form,
    .actions-top-bar,
    .data-section {
      background: #678071 !important;
      padding: 20px !important;
      border-radius: 10px !important;
      border: 1px solid rgba(255, 255, 255, 0.2) !important;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
    }

    .search-section h1,
    .form h1,
    .data-section h1 {
      text-align: center;
      color: #ffffff;
      margin-bottom: 15px;
      font-size: 20px;
    }

    /* حقول الإدخال */
    .search-section input.search-txt,
    .search-section select.filter-select,
    .form input,
    .form select {
      display: block !important;
      width: 100% !important;
      max-width: 450px !important;
      margin: 10px auto !important;
      box-sizing: border-box !important;
      font-family: 'Cairo', sans-serif !important;
      border-radius: 8px !important;
      padding: 12px !important;
      font-size: 14px !important;
      background: #ffffff !important;
      border: 1px solid #ccc !important;
      color: #000000 !important;
    }

    /* أزرار الفورم */
    .inter1 {
      display: flex !important;
      gap: 10px !important;
      width: 100% !important;
      max-width: 450px !important;
      margin: 15px auto 0 auto !important;
      box-sizing: border-box !important;
    }

    .inter1 button {
      flex: 1 !important;
      padding: 12px 5px !important;
      border: none !important;
      border-radius: 8px !important;
      font-weight: bold !important;
      cursor: pointer !important;
      font-family: 'Cairo', sans-serif !important;
      color: white !important;
      text-align: center !important;
      font-size: 14px !important;
      transition: 0.2s !important;
    }

    .inter1 .reg { background: #27ae60; }
    .inter1 .reg:hover { background: #219653; }
    
    .inter1 .upa { background: #2980b9; }
    .inter1 .upa:hover { background: #1f618d; }

    .inter1 .cel { background: #7f8c8d; }
    .inter1 .cel:hover { background: #626d6e; }

    /* زر تحميل البيانات */
    .actions-top-bar {
      display: flex !important;
      justify-content: center !important;
      align-items: center !important;
    }

    .pdf-btn {
      width: 100% !important;
      max-width: 450px !important;
      padding: 12px 10px !important;
      border: none !important;
      border-radius: 8px !important;
      font-weight: bold !important;
      cursor: pointer !important;
      font-family: 'Cairo', sans-serif !important;
      color: white !important;
      text-align: center !important;
      font-size: 14px !important;
      background: #e67e22;
      transition: 0.2s !important;
    }

    .pdf-btn:hover { background: #d35400; }

    /* جدول البيانات */
    .table-container {
      width: 100% !important;
      margin: 0 auto !important;
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: rgba(0, 0, 0, 0.15);
      border-radius: 8px;
      overflow: hidden;
    }

    th, td {
      padding: 10px 8px;
      text-align: center;
      font-size: 13px;
      color: #fff;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    th {
      background: rgba(0, 0, 0, 0.25);
      font-weight: bold;
    }

    .table-container td button {
      display: inline-block;
      width: 70px;
      padding: 6px 0;
      margin: 2px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      font-family: 'Cairo', sans-serif;
      font-weight: bold;
      color: white;
      text-align: center;
      font-size: 12px;
    }

    .table-container td button:first-of-type { background-color: #2980b9; }
    .table-container td button:first-of-type:hover { background-color: #1f618d; }
    .table-container td button:last-of-type { background-color: #c0392b; }
    .table-container td button:last-of-type:hover { background-color: #962d22; }

    @media (max-width: 768px) {
      .content { padding: 0 10px !important; }
      .content > div,
      .cards-container,
      .search-section,
      .form,
      .actions-top-bar,
      .data-section {
        width: 100% !important;
        margin: 10px auto !important;
        padding: 15px !important;
        box-sizing: border-box !important;
      }

      .inter1 {
        flex-direction: column !important;
        gap: 8px !important;
        max-width: 100% !important;
      }
      
      .inter1 button,
      .pdf-btn {
        width: 100% !important;
        max-width: none !important;
        margin: 0 !important;
      }

      .table-container table, 
      .table-container thead, 
      .table-container tbody, 
      .table-container th, 
      .table-container td, 
      .table-container tr {
        display: block !important;
        width: 100% !important;
        box-sizing: border-box !important;
      }

      .table-container thead { display: none !important; }

      .table-container tr {
        background: rgba(255, 255, 255, 0.05);
        margin: 0 auto 15px auto !important;
        max-width: 100% !important;
        border-radius: 8px;
        padding: 12px;
        border: 1px solid rgba(255, 255, 255, 0.15);
        box-sizing: border-box;
      }

      .table-container td {
        display: flex !important;
        justify-content: space-between !important;
        align-items: center !important;
        text-align: right !important;
        direction: rtl !important;
        padding: 8px 6px !important;
        font-size: 13px !important;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        box-sizing: border-box !important;
      }

      .table-container td:last-child {
        border-bottom: none !important;
        flex-direction: column !important;
        gap: 6px !important;
        padding-top: 10px !important;
      }

      .table-container td button {
        width: 100% !important;
        font-size: 13px !important;
        padding: 8px !important;
        margin: 0 !important;
        box-sizing: border-box !important;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="user-bar">
      <span id="username">مرحباً، User</span>
      <button id="logout-btn">تسجيل الخروج</button>
    </div>

    <nav class="bar">
      <ul>
              <a href="/Langdex/admin.html"><li>الرئيسية</li></a>
        <a href="/Langdex/log.html"><li>السجل</li></a>
<a href="/Langdex/admin-manage.html"><li>إدارة</li></a>
        <a href="/Langdex/users.html"><li>المستخدمين</li></a>
        <a href="#"><li>الإعدادات</li></a>
      </ul>
    </nav>
  </header>

  <div class="content">

    <!-- 1. قسم الإحصائيات -->
    <div>
      <div class="cards-container" id="cardsContainer">
          <div class="card">
              <h3>إجمالي المستخدمين</h3>
              <p id="totalUsersCount">0</p>
          </div>
      </div>
    </div>

    <!-- 2. قسم البحث والفلترة -->
    <div class="search-section">
      <h1>البحث</h1>
      <input type="text" class="search-txt" placeholder="ابحث برقم الـ ID، الكلمة، المعنى، اليوزر، أو اللغة...">
      <select class="filter-select" id="languageFilterSearch">
          <option value="all">كل اللغات (للبحث أو العرض)</option>
      </select>
    </div>

    <!-- 3. فورم إدارة الكلمات -->
    <div class="form">
      <h1>إدارة الكلمات</h1>
      <input type="number" placeholder="ID الكلمة" readonly>
      <input type="text" placeholder="اسم اليوزر (قبل @)">
      <input type="text" placeholder="الكلمة">
      <input type="text" placeholder="المعنى">
      <input type="text" placeholder="المرادف">
      <select id="formLanguageSelect">
          <option hidden>إختر اللغة</option>
          <option hidden>Hindi</option>
          <option hidden>Urdu</option>
          <option hidden>Persian</option>
          <option hidden>Chinese</option>
          <option hidden>Bengali</option>
          <option hidden>Turkish</option>
          <option hidden>French</option>
          <option hidden>Spanish</option>
          <option hidden>German</option>
          <option hidden>Japanese</option>
          <option hidden>Korean</option>
          <option hidden>Dutch</option>
          <option hidden>Hebrew</option>
          <option>الإنجليزية</option>
          <option>الهندية</option>
          <option>الأردية</option>
          <option>الفارسية</option>
          <option>الصينية</option>
          <option>البنغالية</option>
          <option>التركية</option>
          <option>الفرنسية</option>
          <option>الإسبانية</option>
          <option>الألمانية</option>
          <option>اليابانية</option>
          <option>الكورية</option>
          <option>الهولندية</option>
          <option>العبرية</option>
      </select>
      
      <div class="inter1">
        <button type="button" class="reg">إضافة كلمة جديدة</button>
        <button type="button" class="upa">تعديل الكلمة المحددة</button>
        <button type="button" class="cel">مسح البيانات</button>
      </div>
    </div>

    <!-- 4. زر تحميل البيانات -->
    <div class="actions-top-bar">
      <button type="button" class="pdf-btn" id="downloadPdfBtn">تحميل البيانات المعروضة</button>
    </div>

    <!-- 5. جدول عرض سجل البيانات -->
    <div class="data-section">
      <h1>سجل البيانات</h1>
      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>بواسطة</th>
              <th>الكلمة</th>
              <th>المعنى</th>
              <th>التفاصيل / المرادفات</th>
              <th>اللغة</th>
              <th>الرول</th>
              <th>الساعة والتاريخ</th>
              <th>الإجراءات</th>
            </tr>
          </thead>
          <tbody id="data-table">
            <tr><td colspan="9" style="text-align: center;">جاري تحميل البيانات...</td></tr>
          </tbody>
        </table>
      </div>
    </div>

  </div>

  <script type="module" src="/Langdex/auth-guard.js"></script>
  <script type="module" src="/Langdex/user-bar.js"></script>
  <script type="module" src="admin.js"></script>

</body>

</html>
