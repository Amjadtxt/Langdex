<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-content="CONTENT-TYPE" content="text/html; charset=UTF-8">
  <title>Admin Dashboard</title>

  <!-- CSS -->
  <link rel="stylesheet" href="/Langdex/style.css">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- مكتبة jsPDF لتصدير الـ PDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <style>
    .content {
      padding: 0 15px !important;
      box-sizing: border-box !important;
    }

    .content > div,
    .cards-container,
    .search-section,
    .actions-top-bar,
    .range-delete-box,
    .data-section {
      width: 100% !important;
      max-width: 850px !important;
      margin: 15px auto !important;
      box-sizing: border-box !important;
    }

    .cards-container {
      display: grid !important;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)) !important;
      gap: 12px !important;
    }

    .card {
      background: rgba(255, 255, 255, 0.05);
      padding: 15px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      text-align: center;
      box-sizing: border-box;
    }

    .card h3 {
      font-size: 13px;
      color: #aaa;
      margin-bottom: 5px;
    }

    .card p {
      font-size: 18px;
      font-weight: bold;
      color: #00bcd4;
      margin: 0;
    }

    .search-section,
    .actions-top-bar,
    .range-delete-box,
    .data-section {
      background: #678071 !important;
      padding: 20px !important;
      border-radius: 10px !important;
      border: 1px solid rgba(255, 255, 255, 0.2) !important;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
    }

    .search-section h1,
    .data-section h1 {
      text-align: center;
      color: #ffffff;
      margin-bottom: 15px;
      font-size: 20px;
    }

    .search-section input.search-txt,
    .search-section select.filter-select,
    .range-delete-box input {
      display: block !important;
      width: 100% !important;
      max-width: 450px !important;
      margin: 10px auto !important;
      box-sizing: border-box !important;
      font-family: 'Cairo', sans-serif !important;
      border-radius: 8px !important;
      padding: 12px !important;
      font-size: 14px !important;
      background: #ffffff !important;
      border: 1px solid #ccc !important;
      color: #000000 !important;
    }

    .actions-top-bar {
      display: flex !important;
      gap: 10px !important;
      align-items: center !important;
      max-width: 850px !important;
    }

    .actions-top-bar button {
      flex: 1 !important;
      padding: 12px 10px !important;
      border: none !important;
      border-radius: 8px !important;
      font-weight: bold !important;
      cursor: pointer !important;
      font-family: 'Cairo', sans-serif !important;
      color: white !important;
      text-align: center !important;
      font-size: 14px !important;
      transition: 0.2s !important;
    }

    .pdf-btn { background: #e67e22; }
    .pdf-btn:hover { background: #d35400; }

    .range-delete-box {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: center;
    }

    .range-delete-box input {
      flex: 1;
      min-width: 140px;
      max-width: 250px !important;
      margin: 0 !important;
    }

    .range-delete-btn {
      width: 100% !important;
      max-width: 450px !important;
      background: #852222;
      color: white;
      padding: 12px 10px;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      font-family: 'Cairo', sans-serif;
      transition: 0.2s;
      text-align: center;
      font-size: 14px;
      margin: 10px auto 0 auto !important;
      display: block !important;
    }

    .range-delete-btn:hover { background: #a93232; }

    .table-container {
      width: 100% !important;
      margin: 0 auto !important;
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: rgba(0, 0, 0, 0.15);
      border-radius: 8px;
      overflow: hidden;
    }

    th, td {
      padding: 10px 8px;
      text-align: center;
      font-size: 13px;
      color: #fff;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    th {
      background: rgba(0, 0, 0, 0.25);
      font-weight: bold;
    }

    .table-container td button {
      display: inline-block;
      width: 70px;
      padding: 6px 0;
      margin: 2px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      font-family: 'Cairo', sans-serif;
      font-weight: bold;
      color: white;
      text-align: center;
      font-size: 12px;
    }

    .table-container td button:first-of-type { background-color: #2980b9; }
    .table-container td button:first-of-type:hover { background-color: #1f618d; }
    .table-container td button:last-of-type { background-color: #c0392b; }
    .table-container td button:last-of-type:hover { background-color: #962d22; }

    @media (max-width: 768px) {
      .content { padding: 0 10px !important; }
      .content > div,
      .cards-container,
      .search-section,
      .actions-top-bar,
      .range-delete-box,
      .data-section {
        width: 100% !important;
        margin: 10px auto !important;
        padding: 15px !important;
      }

      .actions-top-bar, 
      .range-delete-box {
        flex-direction: column !important;
        gap: 8px !important;
        max-width: 100% !important;
      }
      
      .actions-top-bar button, 
      .range-delete-box input, 
      .range-delete-box button {
        width: 100% !important;
        max-width: none !important;
        margin: 0 !important;
      }

      .table-container table, 
      .table-container thead, 
      .table-container tbody, 
      .table-container th, 
      .table-container td, 
      .table-container tr {
        display: block !important;
        width: 100% !important;
      }

      .table-container thead { display: none !important; }

      .table-container tr {
        background: rgba(255, 255, 255, 0.05);
        margin-bottom: 12px;
        border-radius: 8px;
        padding: 10px;
        border: 1px solid rgba(255, 255, 255, 0.15);
      }

      .table-container td {
        display: flex !important;
        justify-content: space-between !important;
        align-items: center !important;
        text-align: left !important;
        padding: 6px 4px !important;
        font-size: 13px !important;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      }

      .table-container td:last-child {
        border-bottom: none !important;
        flex-direction: column !important;
        gap: 6px !important;
        padding-top: 8px !important;
      }

      .table-container td button {
        width: 100% !important;
        font-size: 13px !important;
        padding: 8px !important;
        margin: 0 !important;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="user-bar">
      <span id="username">مرحباً، User</span>
      <button id="logout-btn">تسجيل الخروج</button>
    </div>

    <nav class="bar">
      <ul>
        <a href="/Langdex/admin.html"><li>الرئيسية</li></a>
        <a href="/Langdex/admin-manage.html"><li>الإدارة</li></a>
        <a href="/Langdex/users.html"><li>المستخدمين</li></a>
        <a href="#"><li>الإعدادات</li></a>
      </ul>
    </nav>
  </header>

  <div class="content">

    <!-- 1. قسم الإحصائيات -->
    <div>
      <div class="cards-container" id="cardsContainer">
          <div class="card">
              <h3>إجمالي المستخدمين</h3>
              <p id="totalUsersCount">0</p>
          </div>
      </div>
    </div>

    <!-- 2. قسم البحث والفلترة -->
    <div class="search-section">
      <h1>البحث</h1>
      <input type="text" class="search-txt" placeholder="ابحث برقم الـ ID، الكلمة، المعنى، اليوزر، أو اللغة...">
      <select class="filter-select" id="languageFilterSearch">
          <option value="all">كل اللغات (للبحث أو العرض)</option>
      </select>
    </div>

    <!-- 3. تصدير PDF -->
    <div class="actions-top-bar">
      <button type="button" class="pdf-btn" id="downloadPdfBtn">تحميل البيانات المعروضة</button>
    </div>

    <!-- 4. حذف نطاق الـ ID -->
    <div class="range-delete-box">
      <input type="number" id="startIdInput" placeholder="من ID رقم...">
      <input type="number" id="endIdInput" placeholder="إلى ID رقم...">
      <button type="button" class="range-delete-btn" id="deleteRangeBtn">حذف النطاق المحدد</button>
    </div>

    <!-- 5. جدول عرض سجل البيانات -->
    <div class="data-section">
      <h1>سجل البيانات</h1>
      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>بواسطة</th>
              <th>الكلمة</th>
              <th>المعنى</th>
              <th>التفاصيل / المرادفات</th>
              <th>اللغة</th>
              <th>الرول</th>
              <th>الساعة والتاريخ</th>
              <th>الإجراءات</th>
            </tr>
          </thead>
          <tbody id="data-table">
            <tr><td colspan="9" style="text-align: center;">جاري تحميل البيانات...</td></tr>
          </tbody>
        </table>
      </div>
    </div>

  </div>

  <script type="module" src="/Langdex/auth-guard.js"></script>
  <script type="module" src="/Langdex/user-bar.js"></script>
  <script type="module" src="admin.js"></script>

</body>

</html>
