<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-content="CONTENT-TYPE" content="text/html; charset=UTF-8">
  <title>Langdex - Admin Dashboard</title>

  <!-- CSS -->
  <link rel="stylesheet" href="/Langdex/style.css">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- SheetJS للإكسيل إن لزم -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <!-- مكتبة jsPDF لتصدير الـ PDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <style>
    /* الإعدادات الأساسية للكمبيوتر والشاشات الكبيرة (متوافقة مع ستايل الدفات) */
    .content > div {
      width: 85% !important;
      max-width: 950px !important;
      margin: 15px auto !important;
      box-sizing: border-box !important;
    }

    /* تنسيق كاردز الإحصائيات لتتوافق مع الستايل العام */
    .cards-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
      margin-bottom: 15px;
      width: 100%;
    }
    .card {
      background: rgba(255, 255, 255, 0.05);
      padding: 15px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      text-align: center;
      box-sizing: border-box;
    }
    .card h3 {
      font-size: 14px;
      color: #aaa;
      margin-bottom: 5px;
    }
    .card p {
      font-size: 20px;
      font-weight: bold;
      color: #00bcd4;
      margin: 0;
    }

    /* تعديلات الموبايل لمنع أي لخبطة في الجدول والمحتوى */
    @media (max-width: 768px) {
      .content > div {
        width: 94% !important;
        margin: 10px auto !important;
        padding: 12px !important;
      }

      /* تحويل الجدول في الموبايل لشكل بطاقات مرتبة */
      .table-container table, 
      .table-container thead, 
      .table-container tbody, 
      .table-container th, 
      .table-container td, 
      .table-container tr {
        display: block !important;
        width: 100% !important;
      }

      .table-container thead {
        display: none !important;
      }

      .table-container tr {
        background: rgba(255, 255, 255, 0.05);
        margin-bottom: 15px;
        border-radius: 8px;
        padding: 10px;
        border: 1px solid rgba(255, 255, 255, 0.15);
        box-sizing: border-box;
      }

      .table-container td {
        display: flex !important;
        justify-content: space-between !important;
        align-items: center !important;
        text-align: left !important;
        padding: 6px 4px !important;
        font-size: 13px !important;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      }

      .table-container td:last-child {
        border-bottom: none !important;
        flex-direction: column !important;
        gap: 8px !important;
        padding-top: 10px !important;
      }

      .table-container td button,
      .table-container td select {
        width: 100% !important;
        font-size: 12px !important;
        padding: 8px !important;
        box-sizing: border-box !important;
      }
    }
  </style>
</head>

<body>

  <!-- ==================================================
       HEADER (الناف بار واليوزر بار الأصلي)
  ================================================== -->
  <header>
    <div class="user-bar">
      <span id="username">مرحباً، User</span>
      <button id="logout-btn">تسجيل الخروج</button>
    </div>

    <nav class="bar">
      <ul>
        <a href="/Langdex/admin.html"><li>الرئيسية</li></a>
        <a href="#"><li>السجل</li></a>
        <a href="/Langdex/users.html"><li>المستخدمين</li></a>
        <a href="#"><li>الإعدادات</li></a>
      </ul>
    </nav>
  </header>


  <!-- ==================================================
       DASHBOARD CONTENT
  ================================================== -->
  <div class="content">

    <!-- قسم إحصائيات الكاردز -->
    <div style="width: 100%;">
      <div class="cards-container" id="cardsContainer">
          <div class="card">
              <h3>إجمالي المستخدمين</h3>
              <p id="totalUsersCount">0</p>
          </div>
          <!-- سيتم حقن إحصائيات اللغات هنا برمجياً -->
      </div>
    </div>

    <!-- قسم البحث والفلترة -->
    <div class="search-section" style="width: 100%;">
      <h1>بحث وسجل الكلمات</h1>
      <div style="display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px;">
        <input type="text" class="search-txt" placeholder="ابحث برقم الـ ID، الكلمة، المعنى، اليوزر، أو اللغة...">
        <select class="filter-select" id="languageFilterSearch" style="padding: 12px; background: #2a2a2a; border: 1px solid #444; color: white; border-radius: 8px; font-size: 15px; font-family: 'Cairo', sans-serif;">
            <option value="all">كل اللغات (للبحث أو العرض)</option>
        </select>
        <button class="search-btn" style="padding: 10px 20px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; background: #00bcd4; color: #121212;">بحث</button>
      </div>
    </div>

    <!-- قسم إدارة الكلمات (فورم الإضافة والتعديل) -->
    <div class="form" style="width: 100%;">
      <h1>إدارة الكلمات</h1>
      <input type="number" placeholder="ID الكلمة" readonly>
      <input type="text" placeholder="اسم اليوزر (قبل @)">
      <input type="text" placeholder="الكلمة">
      <input type="text" placeholder="المعنى">
      <input type="text" placeholder="المرادفات / التفاصيل">
      <select id="formLanguageSelect">
          <option value="">اختر اللغة</option>
          <option value="العربية">العربية</option>
          <option value="الإنجليزية">الإنجليزية</option>
          <option value="الفرنسية">الفرنسية</option>
          <option value="الألمانية">الألمانية</option>
          <option value="الهندية">الهندية</option>
          <option value="الأوردو">الأوردو</option>
          <option value="الفارسية">الفارسية</option>
          <option value="عامة">عامة</option>
      </select>
      
      <div class="inter1" style="grid-column: 1 / -1; display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px;">
        <button type="button" class="reg">إضافة كلمة جديدة</button>
        <button type="button" class="upa">تعديل الكلمة المحددة</button>
        <button type="button" class="cel">مسح الاستمارة</button>
        <button type="button" class="pdf-btn" id="downloadPdfBtn" style="background: #e67e22; color: white; padding: 10px 20px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer;">تحميل PDF للبيانات</button>
      </div>
    </div>

    <!-- جدول عرض سجل الكلمات والبيانات -->
    <div class="data-section" style="width: 100%;">
      <h1>سجل الكلمات والبيانات</h1>
      <div class="table-container" style="width: 95%; margin: 15px auto;">
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>بواسطة (اليوزر)</th>
              <th>الكلمة</th>
              <th>المعنى</th>
              <th>التفاصيل / المرادفات</th>
              <th>اللغة</th>
              <th>الرول</th>
              <th>الساعة والتاريخ</th>
              <th>الإجراءات</th>
            </tr>
          </thead>
          <tbody id="data-table">
            <tr><td colspan="9" style="text-align: center;">جاري تحميل البيانات...</td></tr>
          </tbody>
        </table>
      </div>
    </div>

  </div>


  <!-- ==================================================
       JAVASCRIPT
  ================================================== -->
  <script type="module" src="/Langdex/auth-guard.js"></script>
  <script type="module" src="/Langdex/user-bar.js"></script>
  <script type="module" src="admin.js"></script>

</body>

</html>
