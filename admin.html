<!DOCTYPE html>

<html lang="ar" dir="rtl">

<head>

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <meta http-equiv="CONTENT-TYPE"
        content="text/html; charset=UTF-8">

  <title>Langdex Dashboard</title>


  <!-- CSS -->

  <link rel="stylesheet"
        href="/Langdex/style.css">


  <!-- Google Fonts -->

  <link rel="preconnect"
        href="https://fonts.googleapis.com">

  <link rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap"
    rel="stylesheet">


  <style>

  </style>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>


</head>


<body>


  <!-- ==================================================
       HEADER
  ================================================== -->

  <header>


    <!-- USER BAR -->

    <div class="user-bar">

      <span id="username">
        مرحباً، User
      </span>

      <button id="logout-btn">
        تسجيل الخروج
      </button>

    </div>


    <!-- NAVBAR -->

    <nav class="bar">

      <ul>

        <a href="/Langdex/admin.html">
          <li>الرئيسية</li>
        </a>

        <a href="/Langdex/data.html">
          <li>البيانات</li>
        </a>

        <a href="/Langdex/users.html">
          <li>المستخدمين</li>
        </a>

  

        <a href="#">
          <li>الإعدادات</li>
        </a>

      </ul>

    </nav>


  </header>


  <!-- ==================================================
       DASHBOARD CONTENT
  ================================================== -->

  <div class="content">


    <!-- ==================================================
         SEARCH
    ================================================== -->

    <div class="search-section">
<h1>البحث</h1>
      <input
        type="text"
        placeholder="اكتب كلمة"
        class="search-txt"
        id="search-input"
      >

      <button
        type="button"
        class="search-btn"
        id="search-btn">
        البحث عن عنصر
      </button>

      <div
        class="search-result"
        id="search-result">
      </div>

    </div>


    <!-- ==================================================
         FORM
    ================================================== -->

    <div class="form">

      <h1>لوحة التحكم</h1>


      <!-- ID -->

      <input
        type="text"
        placeholder="ID"
        class="id"
        id="word-id"
       
      >


      <!-- USER EMAIL -->

      <input
        type="text"
        placeholder="اسم المستخدم"
        class="id"
        id="word-user"
   
      >


      <!-- WORD -->

      <input
        type="text"
        placeholder="الكلمة"
        id="word"
      >


      <!-- MEANING -->

      <input
        type="text"
        placeholder="المعنى"
        id="meaning"
      >


      <!-- SYNONYMS -->

      <input
        type="text"
        placeholder="المرادف"
        id="synonyms"
      >


      <!-- LANGUAGE -->

      <select id="language">

        <option value="" disabled selected>
          اختر اللغة
        </option>
<option hidden>English</option>
<option hidden>Hindi</option>
<option hidden>Urdu</option>
<option hidden>Persian</option>
<option hidden>Chinese</option>
<option hidden>Bengali</option>
<option hidden>Turkish</option>
<option hidden>French</option>
<option hidden>Spanish</option>
<option hidden>German</option>
<option hidden>Japanese</option>
<option hidden>Korean</option>
<option hidden>Dutch</option>
<option hidden>Hebrew</option>
        <option>الإنجليزية</option>
<option>الهندية</option>
<option>الأردية</option>
<option>الفارسية</option>
<option>الصينية</option>
<option>البنغالية</option>
<option>التركية</option>
<option>الفرنسية</option>
<option>الإسبانية</option>
<option>الألمانية</option>
<option>اليابانية</option>
<option>الكورية</option>
<option>الهولندية</option>
<option>العبرية</option>
      </select>
<input type="file" id="excelFileInput" accept=".xlsx, .xls" />
<button id="uploadExcelButton">رفع ملف</button>



      <!-- SAVE -->

      <div class="inter1">

        <button
          type="button"
          class="reg"
          id="save-word">
          حفظ
        </button>

      </div>


      <!-- ACTIONS -->

      <div class="inter">

        <button
          type="button"
          class="upa"
          id="update-word">
          تحديث
        </button>

        <button
          type="button"
          class="del"
          id="delete-word">
          حذف
        </button>

        <button
          type="button"
          class="cel"
          id="clear-form">
          مسح
        </button>

      </div>

    </div>

  </div>


  <!-- ==================================================
       JAVASCRIPT
  ================================================== -->

  <script
    type="module"
    src="/Langdex/auth-guard.js">
  </script>

  <script
    type="module"
    src="/Langdex/user-bar.js">
  </script>

  <script
    type="module"
    src="/Langdex/admin.js">
  </script>


</body>

</html>
