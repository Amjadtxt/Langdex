<!DOCTYPE html>

<html lang="ar" dir="rtl">

<head>

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <meta http-equiv="CONTENT-TYPE"
        content="text/html; charset=UTF-8">

  <title>Langdex Dashboard</title>


  <!-- CSS -->

  <link rel="stylesheet"
        href="/Langdex/style.css">


  <!-- Google Fonts -->

  <link rel="preconnect"
        href="https://fonts.googleapis.com">

  <link rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap"
    rel="stylesheet">


  <style>

  </style>

</head>


<body>


  <!-- ==================================================
       HEADER
  ================================================== -->

  <header>


    <!-- USER BAR -->

    <div class="user-bar">

      <span id="username">
        مرحباً، User
      </span>

      <button id="logout-btn">
        تسجيل الخروج
      </button>

    </div>


    <!-- NAVBAR -->

    <nav class="bar">

      <ul>

        <a href="admin.html">
          <li>الرئيسية</li>
        </a>

        <a href="data.html">
          <li>البيانات</li>
        </a>

        <a href="#">
          <li>المستخدمين</li>
        </a>

        <a href="#">
          <li>الإحصائيات</li>
        </a>

  

        <a href="#">
          <li>الإعدادات</li>
        </a>

      </ul>

    </nav>


  </header>


  <!-- ==================================================
       DASHBOARD CONTENT
  ================================================== -->

  <div class="content">


    <!-- ==================================================
         SEARCH
    ================================================== -->

    <div class="search-section">

      <h1>البحث</h1>

      <input
        type="text"
        placeholder="اكتب كلمة"
        class="search-txt"
        id="search-input"
      >

      <button
        type="button"
        class="search-btn"
        id="search-btn">
        بحث
      </button>

      <div
        class="search-result"
        id="search-result">
      </div>

    </div>


    <!-- ==================================================
         FORM
    ================================================== -->

    <div class="form">

      <h1>تسجيل كلمة جديدة</h1>


      <!-- ID -->

      <input
        type="text"
        placeholder="ID"
        class="id"
        id="word-id"
       
      >


      <!-- USER EMAIL -->

      <input
        type="text"
        placeholder="اسم المستخدم"
        class="id"
        id="word-user"
   
      >


      <!-- WORD -->

      <input
        type="text"
        placeholder="الكلمة"
        id="word"
      >


      <!-- MEANING -->

      <input
        type="text"
        placeholder="المعنى"
        id="meaning"
      >


      <!-- SYNONYMS -->

      <input
        type="text"
        placeholder="المرادف"
        id="synonyms"
      >


      <!-- LANGUAGE -->

      <select id="language">

        <option value="" disabled selected>
          اختر اللغة
        </option>

        <option value="الإنجليزية">
          الإنجليزية
        </option>

        <option value="الأردية">
          الأردية
        </option>

        <option value="الهندية">
          الهندية
        </option>

<option value="الصينية">
          الصينية
        </option>
      </select>


      <!-- SAVE -->

      <div class="inter1">

        <button
          type="button"
          class="reg"
          id="save-word">
          حفظ
        </button>

      </div>


      <!-- ACTIONS -->

      <div class="inter">

        <button
          type="button"
          class="upa"
          id="update-word">
          تحديث
        </button>

        <button
          type="button"
          class="del"
          id="delete-word">
          حذف
        </button>

        <button
          type="button"
          class="cel"
          id="clear-form">
          مسح
        </button>

      </div>

    </div>

  </div>


  <!-- ==================================================
       JAVASCRIPT
  ================================================== -->

  <script
    type="module"
    src="/Langdex/auth-guard.js">
  </script>

  <script
    type="module"
    src="/Langdex/user-bar.js">
  </script>

  <script
    type="module"
    src="/Langdex/admin.js">
  </script>


</body>

</html>
