<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-content="CONTENT-TYPE" content="text/html; charset=UTF-8">
  <title>Langdex - Admin Dashboard</title>

  <!-- CSS -->
  <link rel="stylesheet" href="/Langdex/style.css">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- SheetJS للإكسيل -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <!-- مكتبة jsPDF لتصدير الـ PDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <style>
    /* الإعدادات الأساسية المطابقة لصفحة المستخدمين 100% */
    .content > div {
      width: 85% !important;
      max-width: 850px !important;
      margin: 15px auto !important;
      box-sizing: border-box !important;
    }

    /* تنسيق الكاردز (مستثناة من اللون الموحد) */
    .cards-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
      margin-bottom: 15px;
      width: 100%;
    }
    .card {
      background: rgba(255, 255, 255, 0.05);
      padding: 15px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      text-align: center;
      box-sizing: border-box;
    }
    .card h3 {
      font-size: 14px;
      color: #aaa;
      margin-bottom: 5px;
    }
    .card p {
      font-size: 20px;
      font-weight: bold;
      color: #00bcd4;
      margin: 0;
    }

    /* تثبيت اللون #678071 لكل الديفات ما عدا الكاردز */
    .search-section,
    .form,
    .excel-upload-section,
    .actions-top-bar,
    .range-delete-box,
    .data-section {
      background: #678071 !important;
      padding: 15px !important;
      border-radius: 8px !important;
      border: 1px solid rgba(255, 255, 255, 0.2) !important;
      margin-bottom: 15px !important;
      box-sizing: border-box !important;
      width: 100% !important;
    }

    /* تنسيق قسم البحث وقائمة الفلترة */
    .search-section input.search-txt {
      width: 100% !important;
      box-sizing: border-box !important;
    }
    .search-section select.filter-select {
      width: 100% !important;
      box-sizing: border-box !important;
      margin-top: 10px;
      padding: 12px;
      background: #2a2a2a;
      border: 1px solid #444;
      color: white;
      border-radius: 8px;
      font-family: 'Cairo', sans-serif;
    }

    /* تنسيق الأزرار الثلاثة (إضافة، تعديل، مسح) داخل الفورم */
    .inter1 {
      grid-column: 1 / -1;
      display: flex;
      gap: 10px;
      flex-wrap: nowrap;
      margin-top: 10px;
      width: 100%;
      box-sizing: border-box;
    }
    .inter1 button {
      flex: 1;
      min-width: 0;
      padding: 12px 10px;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      font-family: 'Cairo', sans-serif;
      transition: 0.2s;
      box-sizing: border-box;
      color: white;
      text-align: center;
      font-size: 14px;
    }
    .inter1 .reg { background: #27ae60; }
    .inter1 .reg:hover { background: #219653; }
    
    .inter1 .upa { background: #2980b9; }
    .inter1 .upa:hover { background: #1f618d; }

    .inter1 .cel { background: #7f8c8d; }
    .inter1 .cel:hover { background: #626d6e; }

    /* ديف الأزرار العلوية المستقلة */
    .actions-top-bar {
      display: flex !important;
      gap: 10px !important;
      flex-wrap: nowrap !important;
      align-items: center !important;
      justify-content: space-between !important;
    }
    .actions-top-bar button {
      flex: 1 !important;
      min-width: 0 !important;
      padding: 12px 10px !important;
      border: none !important;
      border-radius: 8px !important;
      font-weight: bold !important;
      cursor: pointer !important;
      font-family: 'Cairo', sans-serif !important;
      transition: 0.2s !important;
      box-sizing: border-box !important;
      color: white !important;
      text-align: center !important;
      font-size: 14px !important;
    }
    .fix-lang-btn { background: #8e44ad; }
    .fix-lang-btn:hover { background: #732d91; }

    .delete-edited-btn { background: #c0392b; }
    .delete-edited-btn:hover { background: #962d22; }

    .pdf-btn { background: #e67e22; }
    .pdf-btn:hover { background: #d35400; }

    /* قسم رفع الإكسيل المنفصل */
    .excel-upload-section {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
    }
    .excel-upload-section h3 {
      color: #00bcd4;
      font-size: 15px;
      margin: 0;
    }
    .excel-upload-label {
      background: #27ae60;
      color: white;
      padding: 10px 20px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      font-family: 'Cairo', sans-serif;
      transition: 0.2s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 14px;
    }
    .excel-upload-label:hover { background: #219653; }

    /* تنسيق قسم الحذف بالـ ID */
    .range-delete-box {
      display: flex;
      gap: 10px;
      flex-wrap: nowrap;
      align-items: center;
      justify-content: center;
    }
    .range-delete-box input {
      flex: 1;
      min-width: 0;
      padding: 12px 10px;
      background: #ffffff;
      border: 1px solid #ccc;
      color: #000000;
      border-radius: 8px;
      font-family: 'Cairo', sans-serif;
      text-align: center;
      box-sizing: border-box;
      font-size: 14px;
    }
    .range-delete-box input::placeholder {
      color: #666;
    }
    .range-delete-btn {
      flex: 1;
      min-width: 0;
      background: #852222;
      color: white;
      padding: 12px 10px;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      font-family: 'Cairo', sans-serif;
      transition: 0.2s;
      box-sizing: border-box;
      text-align: center;
      font-size: 14px;
    }
    .range-delete-btn:hover { background: #a93232; }

    /* تنسيق أزرار الإجراءات داخل الجدول */
    .table-container td button {
      display: inline-block;
      width: 75px;
      padding: 6px 0;
      margin: 3px auto;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      font-family: 'Cairo', sans-serif;
      font-weight: bold;
      color: white;
      text-align: center;
      font-size: 13px;
    }
    .table-container td button:first-of-type {
      background-color: #2980b9;
    }
    .table-container td button:first-of-type:hover {
      background-color: #1f618d;
    }
    .table-container td button:last-of-type {
      background-color: #c0392b;
    }
    .table-container td button:last-of-type:hover {
      background-color: #962d22;
    }

    /* تعديلات الموبايل للتجاوب السلس */
    @media (max-width: 768px) {
      .content > div {
        width: 94% !important;
        margin: 10px auto !important;
        padding: 12px !important;
      }

      .excel-upload-section {
        flex-direction: column !important;
        align-items: center !important;
        text-align: center !important;
      }
      .excel-upload-section label {
        width: 100% !important;
        box-sizing: border-box !important;
      }

      .inter1, 
      .actions-top-bar, 
      .range-delete-box {
        flex-direction: column !important;
      }
      
      .inter1 button, 
      .actions-top-bar button, 
      .range-delete-box input, 
      .range-delete-box button {
        width: 100% !important;
        max-width: none !important;
      }

      .table-container table, 
      .table-container thead, 
      .table-container tbody, 
      .table-container th, 
      .table-container td, 
      .table-container tr {
        display: block !important;
        width: 100% !important;
      }

      .table-container thead {
        display: none !important;
      }

      .table-container tr {
        background: rgba(255, 255, 255, 0.05);
        margin-bottom: 15px;
        border-radius: 8px;
        padding: 10px;
        border: 1px solid rgba(255, 255, 255, 0.15);
        box-sizing: border-box;
      }

      .table-container td {
        display: flex !important;
        justify-content: space-between !important;
        align-items: center !important;
        text-align: left !important;
        padding: 6px 4px !important;
        font-size: 13px !important;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      }

      .table-container td:last-child {
        border-bottom: none !important;
        flex-direction: column !important;
        gap: 8px !important;
        padding-top: 10px !important;
      }

      .table-container td button {
        width: 100% !important;
        font-size: 13px !important;
        padding: 10px !important;
        box-sizing: border-box !important;
        margin: 2px 0 !important;
      }
    }
  </style>
</head>

<body>

  <!-- ==================================================
       HEADER
  ================================================== -->
  <header>
    <div class="user-bar">
      <span id="username">مرحباً، User</span>
      <button id="logout-btn">تسجيل الخروج</button>
    </div>

    <nav class="bar">
      <ul>
        <a href="/Langdex/admin.html"><li>الرئيسية</li></a>
        <a href="#"><li>السجل</li></a>
        <a href="/Langdex/users.html"><li>المستخدمين</li></a>
        <a href="#"><li>الإعدادات</li></a>
      </ul>
    </nav>
  </header>


  <!-- ==================================================
       DASHBOARD CONTENT
  ================================================== -->
  <div class="content">

    <!-- 1. قسم الإحصائيات -->
    <div style="width: 100%;">
      <div class="cards-container" id="cardsContainer">
          <div class="card">
              <h3>إجمالي المستخدمين</h3>
              <p id="totalUsersCount">0</p>
          </div>
      </div>
    </div>

    <!-- 2. قسم البحث والفلترة -->
    <div class="search-section" style="width: 100%;">
      <h1>البحث</h1>
      <input type="text" class="search-txt" placeholder="ابحث برقم الـ ID، الكلمة، المعنى، اليوزر، أو اللغة...">
      <select class="filter-select" id="languageFilterSearch">
          <option value="all">كل اللغات (للبحث أو العرض)</option>
      </select>
    </div>

    <!-- 3. فورم إدارة الكلمات -->
    <div class="form" style="width: 100%;">
      <h1>إدارة الكلمات</h1>
      <input type="number" placeholder="ID الكلمة" readonly>
      <input type="text" placeholder="اسم اليوزر (قبل @)">
      <input type="text" placeholder="الكلمة">
      <input type="text" placeholder="المعنى">
      <input type="text" placeholder="المرادف">
      <select id="formLanguageSelect">
          <option hidden>إختر اللغة</option>
          <option hidden>Hindi</option>
          <option hidden>Urdu</option>
          <option hidden>Persian</option>
          <option hidden>Chinese</option>
          <option hidden>Bengali</option>
          <option hidden>Turkish</option>
          <option hidden>French</option>
          <option hidden>Spanish</option>
          <option hidden>German</option>
          <option hidden>Japanese</option>
          <option hidden>Korean</option>
          <option hidden>Dutch</option>
          <option hidden>Hebrew</option>
          <option>الإنجليزية</option>
          <option>الهندية</option>
          <option>الأردية</option>
          <option>الفارسية</option>
          <option>الصينية</option>
          <option>البنغالية</option>
          <option>التركية</option>
          <option>الفرنسية</option>
          <option>الإسبانية</option>
          <option>الألمانية</option>
          <option>اليابانية</option>
          <option>الكورية</option>
          <option>الهولندية</option>
          <option>العبرية</option>
      </select>
      
      <div class="inter1">
        <button type="button" class="reg">إضافة كلمة جديدة</button>
        <button type="button" class="upa">تعديل الكلمة المحددة</button>
        <button type="button" class="cel">مسح البيانات</button>
      </div>
    </div>

    <!-- 4. قسم رفع ملف الإكسيل -->
    <div class="excel-upload-section" style="width: 100%;">
      <h3>رفع الكلمات بإستخدام ملف إكسيل</h3>
      <label for="excelFileInput" class="excel-upload-label">
        <span>رفع الملف</span>
        <input type="file" id="excelFileInput" accept=".xlsx, .xls, .csv" style="display: none;">
      </label>
    </div>

    <!-- 5. ديف الأزرار العلوية المنسقة -->
    <div class="actions-top-bar" style="width: 100%;">
      <button type="button" class="fix-lang-btn" id="renameAnyLangBtn">تغيير اسم التصنيف</button>
      <button type="button" class="delete-edited-btn" id="deleteDuplicatesBtn">حذف الكلمات المكررة</button>
      <button type="button" class="pdf-btn" id="downloadPdfBtn">تحميل البيانات المعروضة</button>
    </div>

    <!-- 6. ديف حذف نطاق الـ ID المنسق -->
    <div class="range-delete-box" style="width: 100%;">
      <input type="number" id="startIdInput" placeholder="من ID رقم...">
      <input type="number" id="endIdInput" placeholder="إلى ID رقم...">
      <button type="button" class="range-delete-btn" id="deleteRangeBtn">حذف النطاق المحدد</button>
    </div>

    <!-- 7. جدول عرض سجل الكلمات والبيانات -->
    <div class="data-section" style="width: 100%;">
      <h1>سجل البيانات</h1>
      <div class="table-container" style="width: 95%; margin: 15px auto;">
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>بواسطة (اليوزر)</th>
              <th>الكلمة</th>
              <th>المعنى</th>
              <th>التفاصيل / المرادفات</th>
              <th>اللغة</th>
              <th>الرول</th>
              <th>الساعة والتاريخ</th>
              <th>الإجراءات</th>
            </tr>
          </thead>
          <tbody id="data-table">
            <tr><td colspan="9" style="text-align: center;">جاري تحميل البيانات...</td></tr>
          </tbody>
        </table>
      </div>
    </div>

  </div>


  <!-- ==================================================
       JAVASCRIPT
  ================================================== -->
  <script type="module" src="/Langdex/auth-guard.js"></script>
  <script type="module" src="/Langdex/user-bar.js"></script>
  <script type="module" src="admin.js"></script>

</body>

</html>
